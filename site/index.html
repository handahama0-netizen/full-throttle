<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("ft-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="theme-color" content="#060807">
<link rel="icon" type="image/png" href="favicon.png">

<meta name="description" content="Aktier med 200-veckorszoner, Full Throttle och Low Risk High Reward. Kurser, analytiker och nyckeltal.">
<title>Full Throttle</title>
<style>
/* Layout: app shell — sticky header with search; pages: Start, Aktie, Screener, Strategier */
:root{
  --bg:#f3f4f6; --card:#ffffff; --sunk:#f7f8f9; --hover:#f0f2f4; --line:#e3e6e9; --line-strong:#cfd4d9;
  --ink:#1c2024; --muted:#68717a; --faint:#9aa2aa; --accent:#2c8a17; --accent-ink:#ffffff; --accent-soft:#e4f4de;
  --up:#2a8a17; --down:#d1342c; --up-soft:#e6f4e1; --down-soft:#fbe9e8; --warn:#a15c00; --warn-soft:#fbf0dc;
  --z-fire:#7b3fbf; --z-vcheap:#2563c9; --z-cheap:#15803d; --z-fair:#b38600; --z-exp:#d9670b; --z-vexp:#c62828;
  --z-fire-bg:#efe6fa; --z-vcheap-bg:#e3ecfb; --z-cheap-bg:#e2f4e8; --z-fair-bg:#faf2d6; --z-exp-bg:#fcebdc; --z-vexp-bg:#fbe3e3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060807; --card:#0d110e; --sunk:#111612; --hover:#162019; --line:#1c271f; --line-strong:#2a3a2e;
  --ink:#e6f0e7; --muted:#8c9a8f; --faint:#5f6e62; --accent:#5fd13a; --accent-ink:#061005; --accent-soft:#132c17;
  --up:#5fd13a; --down:#ff5f57; --up-soft:#12291a; --down-soft:#331817; --warn:#e6a54a; --warn-soft:#33270f;
  --z-fire:#b98af0; --z-vcheap:#6fa3f5; --z-cheap:#5fd13a; --z-fair:#e3c04f; --z-exp:#f39a4f; --z-vexp:#ff7b72;
  --z-fire-bg:#241a33; --z-vcheap-bg:#16223a; --z-cheap-bg:#12291a; --z-fair-bg:#2e250e; --z-exp-bg:#33200e; --z-vexp-bg:#351818;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060807; --card:#0d110e; --sunk:#111612; --hover:#162019; --line:#1c271f; --line-strong:#2a3a2e;
  --ink:#e6f0e7; --muted:#8c9a8f; --faint:#5f6e62; --accent:#5fd13a; --accent-ink:#061005; --accent-soft:#132c17;
  --up:#5fd13a; --down:#ff5f57; --up-soft:#12291a; --down-soft:#331817; --warn:#e6a54a; --warn-soft:#33270f;
  --z-fire:#b98af0; --z-vcheap:#6fa3f5; --z-cheap:#5fd13a; --z-fair:#e3c04f; --z-exp:#f39a4f; --z-vexp:#ff7b72;
  --z-fire-bg:#241a33; --z-vcheap-bg:#16223a; --z-cheap-bg:#12291a; --z-fair-bg:#2e250e; --z-exp-bg:#33200e; --z-vexp-bg:#351818;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;letter-spacing:-.005em}
p{margin:0}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.up{color:var(--up)} .down{color:var(--down)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.brand{font-weight:750;font-size:17px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand:hover{text-decoration:none}.brand a{color:var(--ink)}.brandl{display:inline-flex;align-items:center;gap:8px}.brandl img{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1px var(--line-strong),0 0 10px color-mix(in srgb,var(--accent) 35%,transparent)}.brand a:hover{text-decoration:none}
.menubtn{border:0;background:none;padding:6px;margin:-6px;cursor:pointer;border-radius:8px;display:grid;place-items:center}.menubtn:hover{background:var(--hover)}
#menuBg{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:60}
#sitemenu{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:var(--card);border-right:1px solid var(--line);z-index:61;overflow-y:auto;padding:14px 12px 30px;box-shadow:8px 0 30px rgb(0 0 0 / .18);padding-top:calc(14px + env(safe-area-inset-top,0px))}
#sitemenu .mh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px}
#sitemenu .mh b{font-size:17px}
#sitemenu .mx{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);padding:4px 10px;border-radius:8px}#sitemenu .mx:hover{background:var(--hover)}
#sitemenu h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}
#sitemenu a.mi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:start;padding:8px;border-radius:8px;color:var(--ink)}
#sitemenu a.mi:hover,#sitemenu a.mi.on{background:var(--hover);text-decoration:none}
#sitemenu a.mi.on{box-shadow:inset 3px 0 0 var(--accent)}
#sitemenu a.mi .ic{font-size:17px;line-height:1.3;text-align:center}
#sitemenu a.mi b{font-size:14px;font-weight:650}
#sitemenu a.mi small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.35}
#sitemenu a.ms{display:block;padding:6px 8px 6px 44px;border-radius:8px;color:var(--ink);font-size:13.5px}#sitemenu a.ms:hover{background:var(--hover);text-decoration:none}
.brand i{width:22px;height:22px;border-radius:6px;background:transparent;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:2px;background:var(--ink);box-shadow:0 -5px 0 var(--ink),0 -10px 0 var(--ink);opacity:.9;width:16px;left:3px;bottom:5px}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--sunk);padding:0 12px 0 36px;font-size:14px}
.search input:focus{background:var(--card);border-color:var(--accent);outline:none}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;stroke:var(--muted)}
.dd{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .12);overflow:hidden;max-height:70vh;overflow-y:auto}
.dd a{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;color:var(--ink);border-bottom:1px solid var(--line)}
.dd a:last-child{border-bottom:0}
.dd a[aria-selected="true"],.dd a:hover{background:var(--hover);text-decoration:none}
.dd .empty{padding:12px;color:var(--muted)}
nav.main{display:flex;gap:4px}
nav.main a{color:var(--muted);padding:8px 10px;border-radius:6px;font-weight:550;white-space:nowrap}
nav.main a:hover{background:var(--hover);text-decoration:none;color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--hover)}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:8px;gap:8px 12px}
  .top .search{order:3;flex-basis:100%;max-width:none}
  nav.main{order:4;flex-basis:100%;overflow-x:auto;margin-inline:-4px;scrollbar-width:none}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{padding:6px 8px;font-size:13px}
}

/* cards & layout */
main{padding-block:18px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.card>.hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:15px;font-weight:650}
.card>.bd{padding:12px 16px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:980px){.g2,.g-main{grid-template-columns:minmax(0,1fr)}}
.sub{font-size:12px;color:var(--muted)}

/* controls */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted);font-weight:550}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.seg .c{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:11.5px}
.btn{border:1px solid var(--line-strong);border-radius:7px;background:var(--card);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-inline:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:550}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* chips */
.z{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:5px;white-space:nowrap;font-weight:550}
.z-fire{color:var(--z-fire);background:var(--z-fire-bg)} .z-vcheap{color:var(--z-vcheap);background:var(--z-vcheap-bg)}
.z-cheap{color:var(--z-cheap);background:var(--z-cheap-bg)} .z-fair{color:var(--z-fair);background:var(--z-fair-bg)}
.z-exp{color:var(--z-exp);background:var(--z-exp-bg)} .z-vexp{color:var(--z-vexp);background:var(--z-vexp-bg)}
.z-none{color:var(--muted);background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:5px;white-space:nowrap;font-weight:550;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.pass{background:var(--up-soft);color:var(--up);border-color:transparent}
.pill.near{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sig{font-size:10.5px;font-weight:750;padding:2px 6px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.sig.guld{background:#b8860b;color:#fff} .sig.diamant{background:linear-gradient(135deg,#2b6cb0,#7f5af0);color:#fff} .sig.swing{background:var(--z-cheap);color:var(--card)} .sig.rea{background:var(--z-vcheap);color:var(--card)}

.ptools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.ptools .fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}.ptools input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:7px;background:var(--card);color:var(--ink);width:130px}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:14px}
.decg h3{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}.decg h3 .c{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:999px;padding:0 7px}.decg h3 .sub{font-weight:400;font-size:12px;color:var(--muted)}
@media (max-width:760px){.dec{grid-template-columns:1fr}}
.rrg{width:100%;height:auto;display:block}.rrg text{font-size:11px;fill:var(--muted)}.rrg .lab{font-size:12px;font-weight:650;fill:var(--ink)}.rrg .ql{font-size:11.5px;font-weight:750;letter-spacing:.04em}.rrg .rp{cursor:pointer}
.phc{display:inline-flex;gap:4px;align-items:center;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.sech{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.seccard.closed .secbody{display:none}
@media (max-width:640px){.sech{flex-wrap:wrap}.sech>div{flex-basis:100%!important}.secfold{margin-left:0}}
.rotc{margin-bottom:10px}.roth{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.rotc.closed .rotbody{display:none}.rotsum{margin-top:6px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}.rotfold{margin-left:4px}
@media (max-width:640px){.roth{flex-wrap:wrap}.rotmain{flex-basis:calc(100% - 40px)!important}.rotfold{margin-left:36px}}.roth h3{font-size:16px}.rk{font-family:var(--mono);font-weight:750;font-size:18px;color:var(--muted);min-width:24px}
.rots{display:grid;justify-items:end;gap:2px}
@media (max-width:640px){.rots{display:none}}
.opp{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;font-family:var(--mono);font-weight:750;font-size:12.5px;color:#fff;background:color-mix(in srgb,var(--up) calc(var(--o)*1%),var(--down))}
.instc{display:inline-grid;justify-items:end;line-height:1.25}.instc .subv{font-size:11px;white-space:nowrap}
.owl{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.ow{font-size:11px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);white-space:nowrap}
ol.best li{align-items:center}
@media (max-width:640px){ol.best li{flex-wrap:wrap;row-gap:6px}ol.best li>span:last-child{width:100%;justify-content:flex-start!important;padding-left:38px}}
.aichain{display:flex;gap:4px;align-items:stretch;overflow-x:auto;margin-top:14px;padding-bottom:6px;scrollbar-width:thin}
.aistep{flex:0 0 auto;display:grid;gap:2px;justify-items:start;border:1px solid var(--line-strong);border-left:4px solid var(--pc);background:var(--card);color:var(--ink);font:inherit;border-radius:9px;padding:7px 10px;cursor:pointer;min-width:104px;text-align:left}
.aistep:hover{border-color:var(--pc)}.aistep span{font-weight:650;font-size:13px;white-space:nowrap}.aistep small{font-size:11px;color:var(--pc);font-weight:650;white-space:nowrap}.aistep .ain{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500}
.aiarr{align-self:center;color:var(--faint)}
.tlg{display:grid;gap:6px;margin-top:6px}
.tlrow{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;align-items:center}
.tll{display:grid;line-height:1.25}.tll b{font-size:13px}
.tlt{position:relative;height:22px;background:var(--sunk);border-radius:6px}
.tlg{position:relative}.tlnowl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3;pointer-events:none;left:calc(220px + (100% - 220px) * var(--x) / 100)}
.tlnowl i{position:absolute;top:-1px;left:5px;font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.06em;background:var(--card);padding:0 3px;border-radius:3px}
.tlax .tlt{background:none;height:18px}.tly{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--mono)}
.tlb{position:absolute;top:2px;bottom:2px;border-radius:6px;display:flex;align-items:center;padding-left:6px;font-size:11px;overflow:hidden;min-width:18px}
.tl-done{background:color-mix(in srgb,var(--faint) 35%,transparent)}.tl-now{background:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 50%,transparent)}.tl-next{background:color-mix(in srgb,var(--warn) 75%,transparent)}.tl-later{background:color-mix(in srgb,var(--z-vcheap) 55%,transparent)}
.tlnow{position:absolute;top:-2px;bottom:-8px;width:2px;background:var(--accent);z-index:2}.tlnow i{position:absolute;top:-2px;left:4px;font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.tlg .tlrow:not(.tlax) .tlt::after{content:"";position:absolute;top:-3px;bottom:-3px;left:var(--nowx,0);width:0}
.tlnowrow{height:0}.tlnowrow .tlt{height:0;background:none}
.tlcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:14px}
.tlc h4{font-size:13px;margin-bottom:6px}.tli{padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--sunk)}
.tlths{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tlth{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 8px}.tlth:hover{text-decoration:none;border-color:var(--accent)}
@media (max-width:640px){.tlrow{grid-template-columns:1fr;gap:3px}.tlax .tll{display:none}.tlnowl{display:none}.tlt .tlnowm{display:block}}
.tlnowm{display:none;position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);z-index:2}
/* nedtryckta */
.dnbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
@media (min-width:701px){.dnbar{position:sticky;top:var(--hh,58px);z-index:5}}
.dncount{font-size:15px}.dncount b{font-size:18px}
.dnact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.dnact .more{margin:0}
.dnsort{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
.dnsort select{font:inherit;font-weight:500;padding:5px 8px;border-radius:7px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink)}
.dnchips{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.dnchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600}
.dnchip:not(:has(button)){padding-right:10px}
.dnchip button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 6px;border-radius:999px}
.dnchip button:hover{color:var(--down);background:var(--card)}
.dnpanel{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:14px;background:var(--sunk)}
.dngrp{display:grid;gap:8px}.dngrp h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dnf{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.dnl{font-size:13px;font-weight:600;min-width:150px}
.sfk.dim{opacity:.5}
.dnt th{padding:0}.dnt .thb{all:unset;cursor:pointer;display:flex;gap:4px;align-items:center;justify-content:flex-end;padding:9px 12px;width:100%;box-sizing:border-box}
.dnt th.l .thb{justify-content:flex-start}.dnt .thb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dnt .arr{font-size:10px;color:var(--faint)}.dnt th[aria-sort="ascending"] .arr,.dnt th[aria-sort="descending"] .arr{color:var(--accent)}
.dnt td{vertical-align:middle}
.dnt .stk{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
.dnt th.stk{z-index:3}
.dnt tr.go:hover td.stk{background:var(--hover)}
.t-good{color:var(--up);font-weight:650}.t-bad{color:var(--down);font-weight:650}
.b52{display:inline-flex;align-items:center;gap:6px}
.dngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dnsel{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}

  revCagr:["Omsättningstillväxt 5 år","Genomsnittlig årlig ökning av omsättningen mellan äldsta och senaste helåret som Yahoo har (oftast 3–4 år). Full Throttle kräver över 100 % totalt på 5 år, vilket är ungefär 15 % per år."],
  revGrowth1y:["Omsättningstillväxt 1 år","Omsättningen de senaste 12 månaderna jämfört med 12 månader innan. Visar om tillväxten håller i sig just nu."],
  earnGrowth1y:["Vinsttillväxt 1 år","Vinst per aktie de senaste 12 månaderna jämfört med 12 månader innan. Low Risk, High Reward kräver över 5 %."],
  roe:["ROE, avkastning på eget kapital","Nettovinst delat med eget kapital. Hur mycket bolaget tjänar på aktieägarnas pengar. Över 15 % räknas som bra. Kan bli missvisande högt när eget kapital är litet på grund av återköp."],
  roic:["ROIC, avkastning på investerat kapital","Rörelseresultat efter skatt delat med skuld plus eget kapital minus kassa. Det bästa måttet på om bolaget skapar värde. Högre än avkastningskravet (ofta 8–10 %) betyder att varje investerad krona är värd mer än en krona."],
  grossMargin:["Bruttomarginal","Andel av omsättningen kvar efter direkta kostnader för varan eller tjänsten. Hög bruttomarginal tyder på prissättningsmakt. Mjukvara ofta 70–90 %, hårdvara 20–40 %."],
  opMargin:["Rörelsemarginal","Rörelseresultat delat med omsättning. Vad som blir kvar efter alla rörelsekostnader."],
  netMargin:["Nettomarginal","Nettovinst delat med omsättning, efter räntor och skatt."],
  fcfMargin:["FCF-marginal","Fritt kassaflöde delat med omsättning. Hur mycket riktiga pengar bolaget genererar per såld krona, efter investeringar. Positivt betyder att tillväxten inte behöver finansieras med lån eller nyemissioner."],
  de:["Skuld / eget kapital (D/E)","Räntebärande skuld delat med eget kapital. Under 1 betyder mer eget kapital än skuld. Höga värden ökar risken vid räntehöjningar eller svaga år. Negativt eget kapital (neg. EK) går inte att räkna."],
  peg:["PEG","P/E-talet delat med förväntad årlig vinsttillväxt. Under 1 betyder att du betalar lite för tillväxten, över 2 dyrt. Mycket låga värden (under 0,2) kan bero på en tillfällig vinsttopp hos cykliska bolag."],
  pe:["P/E","Börsvärde delat med vinsten de senaste 12 månaderna. Hur många års vinst du betalar för."],
  fwdPe:["P/E framåt","Kursen delat med analytikernas förväntade vinst per aktie nästa 12 månader."],
  ps:["P/S","Börsvärde delat med omsättning. Används för bolag utan vinst."],
  pb:["P/B","Börsvärde delat med eget kapital (bokfört värde)."],
  evEbitda:["EV/EBITDA","Företagsvärde (börsvärde plus nettoskuld) delat med rörelseresultat före avskrivningar. Jämförbart mellan bolag med olika skuldsättning."],
  divYield:["Direktavkastning","Årlig utdelning delat med kursen, i procent."],
  beta:["Beta","Hur mycket aktien brukar röra sig när marknaden rör sig 1 %. Beta 1,5 = 1,5 % i snitt. Används för att räkna ut avkastningskravet och marknadens del av kursrörelsen."],
  hilo:["52 veckor","Högsta och lägsta kurs det senaste året."],
  mcap:["Börsvärde","Antal aktier gånger kursen, omräknat till US-dollar. md = miljarder, bn = tusen miljarder."],
  shareChange:["Utspädning","Hur mycket antalet aktier ökat senaste året. Positivt = nya aktier (nyemission, aktiebaserade löner) som späder ut ägandet. Negativt = återköp."],
  targetMean:["Riktkurs","Analytikernas genomsnittliga bedömning av vad aktien är värd om ungefär 12 månader. Lägst och högst visar spridningen."],
  upside:["Uppsida","Hur mycket riktkursen ligger över (+) eller under (−) dagens kurs."],
  recMean:["Analytikernas betyg","Snitt av alla rekommendationer på en skala 1–5: 1 = starkt köp, 3 = behåll, 5 = sälj."],
  analysts:["Analytikerna","Sammanställning av bankernas och analyshusens rekommendationer och riktkurser, via Yahoo Finance."],
  dnInfo:["Nedtryckta kvalitetsbolag","Fall från toppen = hur långt kursen ligger under sin högsta kurs (all-time high, räknat på kurshistorik sedan 2010). Tjänar pengar = positiv nettomarginal och positivt fritt kassaflöde. Växer = omsättningen ökade senaste året. Ett stort fall i ett bolag som fortfarande är lönsamt och växer kan vara ett köpläge, men kolla alltid varför det föll: ibland vet marknaden något som siffrorna bakåt inte visar än."],
  rotInfo:["Sektorrotation","Pengar flyttar mellan sektorer i cykler. Varje sektor mäts med två tal: styrka = hur mycket bättre eller sämre den gått än S&P 500 senaste kvartalet, och fart = om styrkan ökar eller minskar senaste 4 veckorna. Fart som vänder upp i en svag sektor (🚀 På väg upp) är ofta första tecknet på att pengar börjar rotera in, innan sektorn syns bland de hetaste. Samma idé som ett Relative Rotation Graph (RRG)."],
  instData:["Institutionsägande och förändring","Andel: hur stor del av aktierna fonder, pensionsbolag och banker äger, från Yahoo Finance. Hämtas varje natt, men Yahoo uppdaterar själva siffran ungefär en gång i månaden. Förändring (USA): nettoköp eller nettoförsäljning senaste kvartalet i procent av institutionernas innehav, från 13F-rapporterna via Nasdaq. Institutionerna rapporterar en gång per kvartal och har 45 dagar på sig, så Q2 (april–juni) blir komplett i mitten av augusti. ▲ över +0,25 % = köper, ▼ under −0,25 % = säljer. 'Förra kv.' = ägd andel enligt 13F kvartalet innan (visas när vi har två kvartal sparade). Svenska bolag har ingen 13F: där visas ändringen i Yahoos andel sedan ett tidigare datum när den finns. Över 100 % kan förekomma i 13F eftersom aktier som lånats ut räknas hos flera."],
  aiInfo:["AI-kedjan","AI kräver en hel kedja: chip, tillverkning, minne, nätverk, servrar, kyla, elnät, el, råvaror, datacenter, molnjättar och mjukvara. Pengarna flyttar längs kedjan när flaskhalsarna skiftar: först GPU:er, sedan minne och nätverk, nu allt mer el och elnät. Varje steg visar sitt läge (som i Sektorrotation) och bolagen rangordnade efter Bäst läge."],
  aiTl:["Var är vi i AI-utbyggnaden?","AI-utbyggnaden har flyttat genom flaskhalsar: först GPU:er (2023), sedan paketering och nätverk (2024–2025), nu minne och kyla, och framåt el, elnät och ny elproduktion. Staplarna visar när varje fas uppskattas vara som mest akut, och den gröna linjen är idag. Bredvid varje fas står sidans live-läge för temat (från kursdatan), så att du kan se om pengarna redan börjat rotera dit. Årtalen är Claudes uppskattning utifrån branschkällor och uppdateras när läget ändras."],
  aiPort:["AI-portfölj","Ett förslag på hur man kan äga hela AI-kedjan: det bolag med högst Bäst läge-poäng i varje flaskhals (minst 5 md $ i börsvärde). Vikten är lika för alla teman men justeras efter läget: heta och teman på väg upp 1,25, svalnande 0,75, kalla 0,5. Räknas om varje gång sidan öppnas med dagens data."],
  oppInfo:["Bäst läge","En poäng 0–100 för hur bra köpläge bolaget har just nu jämfört med andra i samma bransch: P/E framåt mot branschens median (20 %), PEG (15 %), sammanvägd värdering med DCF och riktkurser (15 %), avstånd till 200W-snittet (20 %), hur mycket institutionerna äger och om de köper (15 %) och kvalitet (15 %). Avdrag: förlust 40 %, negativt kassaflöde 15 %, kurs mer än 60 % över 200W 15 % och mer än 100 % över 25 %. Störst är något annat: det är bara omsättning."],
  dnBear:["Bear case","Bear case är det pessimistiska värdet på aktien, i procent mot dagens kurs. Från kassaflödesvärderingen (DCF, halverad tillväxt och högre ränta) när den finns, annars analytikernas lägsta riktkurs. Bear case ≥ −10 % betyder att även i ett dåligt scenario faller aktien högst 10 %. Över 0 % = aktien är billigare än även det pessimistiska värdet. Förväntat väger bear 25 %, bas 50 % och bull 25 %, samma som på aktiesidan."],
  dn52:["Läge i 52 veckor","Var kursen ligger mellan årets lägsta (0 %) och högsta (100 %) kurs. Nära 0 % = aktien handlas nära årets botten."],
  earnBeat:["Slog eller missade","Vid varje kvartalsrapport jämförs bolagets vinst per aktie med vad analytikerna väntade sig i snitt. Slog = högre än väntat. Kursreaktionen visar hur marknaden tog emot rapporten. Ett bolag som slår gång på gång men där kursen ändå faller har ofta väldigt höga förväntningar inbakade."],
  nextEarnings:["Nästa rapport","Datum för nästa kvartalsrapport. Kursen kan röra sig kraftigt kring rapporten, så många undviker att öppna nya swingar veckan innan."],
  attribution:["Varför aktien rört sig","Kursrörelsen delas upp i tre delar: marknaden (beta × index), sektorn (sektor-ETF minus index) och det bolagsspecifika (resten). Det bolagsspecifika är det som har med just bolaget att göra, till exempel rapporter och nyheter."],
  mktPart:["Marknad","Den del av rörelsen som förklaras av hela börsen: aktiens beta gånger indexets utveckling (S&P 500 eller OMX Stockholm 30)."],
  secPart:["Sektor","Hur mycket aktiens sektor (t.ex. tekniksektorn via ETF:en XLK) gått bättre eller sämre än index under perioden."],
  idioPart:["Bolagsspecifikt","Det som återstår när marknad och sektor räknats bort. Här syns rapporter, nyheter och förändrade förväntningar på just bolaget."],
  sigma:["Ovanlighet (σ)","Den bolagsspecifika rörelsen jämfört med aktiens normala svängningar. Över 1,5 σ är ovanligt stort, över 2 σ mycket ovanligt."],
  epsRev:["Prognosändring","Hur analytikernas vinstprognos (vinst per aktie nästa år) ändrats under samma period. Om kursen faller kraftigt men prognosen står still är det ett tecken på överreaktion."],
  verdicts:["Bedömning","Möjlig överreaktion: ovanligt bolagsspecifikt fall utan sänkta prognoser. Fundamentalt motiverat: prognoserna sänks samtidigt. Makro/sektor: rörelsen förklaras mest av marknad eller sektor och brukar gå över. Uppgång utan stöd: kursen har stigit utan att prognoserna höjts."],
  signalbild:["Signalbild","Sammanvägning av värdering (DCF), kvalitet (ROIC mot avkastningskrav), prognostrend, 200W-zon och analytikernas uppsida. Inget köp- eller säljråd."],
  valuation:["Värdering och intrinsic value","Olika sätt att räkna ut vad aktien är värd, jämfört med dagens kurs (streckad linje). Ligger kursen under de flesta intervallen är aktien billig enligt metoderna."],
  dcf:["DCF","Diskonterat kassaflöde. Bolagets framtida fria kassaflöden (minus aktiebaserade löner) räknas om till vad de är värda idag med ett avkastningskrav. Bear = försiktigt antagande, bull = optimistiskt."],
  reverseDcf:["Omvänd DCF","Räknar baklänges: vilken årlig tillväxt år 1–5 krävs för att dagens kurs ska vara rimlig? Är den högre än analytikernas prognos är förväntningarna högt ställda."],
  graham:["Graham-formeln","Benjamin Grahams enkla formel: vinst per aktie × (8,5 + 2 × tillväxt) × 4,4 / obligationsränta. Ger en grov uppskattning för lönsamma bolag."],
  wacc:["Avkastningskrav","Den årliga avkastning en investerare kräver: 10-årsränta + beta × 5 % riskpremie. Används som diskonteringsränta i DCF."],
  estimates:["Prognoser och rapporter","Analytikernas vinstprognos och hur den ändrats, antal höjningar och sänkningar, och hur bolaget levererat mot förväntningarna de senaste kvartalen."],
  surprise:["Rapportöverraskning","Hur mycket vinsten per aktie blev högre (+) eller lägre (−) än analytikerna väntat."],
  radar:["Radar","Varje prick är en aktie. Vänster–höger: hur dyr den är mot 200W-snittet. Upp–ner: poäng i vald strategi. De bästa lägena finns uppe till vänster: hög kvalitet till lågt pris."],
  watchBuy:["Bevakning: bra bolag, fel pris","Aktier som klarar en strategi men ligger över köpzonen. Kolumnen Kvar visar hur mycket kursen måste falla för att hamna i köpzonen."],
  nearLrhr:["Nära Low Risk, High Reward","Billiga aktier mot 200W som bara missar ett krav i Low Risk, High Reward."],
  events:["Händelser","Aktier som bytt 200W-zon eller fått eller tappat en signal sedan förra uppdateringen."],
  watch:["Min bevakning","Aktier du markerat med ☆. Sparas i den här webbläsaren."],
  invested:["Insats","Vad du betalade i kronor, inklusive växlingskursen när du köpte."],
  value:["Värde nu","Antal × dagens kurs × dagens valutakurs till kronor."],
  pl:["Resultat","Värde nu minus insats, i kronor och procent. Inkluderar valutaeffekten."],
  todayPl:["Idag","Hur mycket värdet ändrats sedan gårdagens stängning."],
  stopTarget:["Stop och mål","Dina egna nivåer. Stop = kurs där du tänkt sälja för att begränsa förlusten. Mål = kurs där du tänkt ta hem vinsten. Du får en markering när kursen passerat någon av dem."],
  held:["Dagar","Antal dagar sedan köpet."],
  industryRank:["Plats i branschen","Bolaget jämförs med andra bolag i samma bransch bland sidans ~600 aktier. För varje nyckeltal inom tillväxt, lönsamhet, värdering och risk räknas var bolaget hamnar (bäst = 100 %, sämst = 0 %). Snittet av dessa ger den sammanvägda platsen. Är branschen för liten används tema eller sektor."],
  wacc:["WACC (avkastningskrav)","Vägd kapitalkostnad: vad ägare och långivare tillsammans kräver i avkastning. Eget kapital = riskfri ränta + beta × 5 % (CAPM). Lån = riskfri ränta + 1,5 %, minus 21 % skatt eftersom räntor är avdragsgilla. Vikterna är börsvärde och skuld. Hålls mellan 6 och 14 %."],
  tvShare:["Andel terminalvärde","Hur stor del av DCF-värdet som kommer från åren efter år 10. Över 75 % betyder att värdet mest vilar på antaganden om en avlägsen framtid och därför är osäkert. Under 40 % kan tyda på för försiktiga antaganden."],
  sens:["Känslighetstabell","Visar hur DCF-värdet ändras om avkastningskravet (rader) eller den eviga tillväxten (kolumner) är lite högre eller lägre. Mittenrutan är basfallet. Ett stort spann betyder att värderingen är känslig."],
  secData:["SEC EDGAR","Siffror direkt från bolagets årsredovisningar (10-K) hos den amerikanska finansinspektionen SEC. Officiella och reviderade, gratis. Fritt kassaflöde = kassaflöde från verksamheten minus investeringar i anläggningar. Används för 5-års omsättningstillväxt och DCF när Yahoo saknar data."],
  peerQuart:["Kvartiler","25 % av bolagen i branschen ligger under 25:e percentilen och 25 % över 75:e. Visar spridningen: ligger bolaget över 75:e percentilen hör det till branschens bästa (eller dyraste) fjärdedel."],
  peerPe:["Värde enligt branschens P/E","Vad aktien skulle vara värd om den värderades som branschens medianbolag: bolagets väntade vinst per aktie × branschens median-P/E framåt. Ett enkelt jämförelsevärde, inte en riktkurs."],
  rule40:["Rule of 40","Tumregel för mjukvara och tillväxtbolag: omsättningstillväxt + FCF-marginal bör vara minst 40 %. Visar balansen mellan att växa och att tjäna pengar."],
  fcfYield:["FCF-avkastning","Fritt kassaflöde delat med börsvärdet, i procent. Hur mycket kontanter bolaget genererar per investerad krona. Högre = billigare."],
  instPct:["Institutionellt ägande","Andel av aktierna som ägs av fonder, pensionsbolag, banker och andra institutioner. Högt ägande (60–80 % i stora amerikanska bolag) betyder att professionella förvaltare tror på bolaget och ger stabila ägare, men också att kursen kan röra sig mycket när de säljer samtidigt."],
  insPct:["Insiders ägande","Andel av aktierna som ägs av ledning, styrelse och storägare med insyn. Högt eget ägande betyder att de som driver bolaget har samma intresse som du. I megabolag är det ofta under 1 %, i grundarledda bolag 10 % eller mer."],
  instFlow:["Institutionernas nettoflöde","Hur många aktier institutionerna köpt minus sålt senaste kvartalet, i procent av allt de äger. Plus antal köpare (ökat eller ny position) per säljare (minskat eller sålt allt). Bullish = fler köper än säljer och nettot är positivt, Bearish = tvärtom. Bygger på 13F-anmälningar."],
  holders:["Vem äger aktien?","Institutionernas och insiders andel, hur institutionernas andel ändrats över tid, och de tio största institutionella ägarna med hur mycket de ökat eller minskat senaste kvartalet."],
  peerMean:["Branschsnitt","Vanligt medelvärde av bolagen i branschen. Kan dras iväg av enstaka extremvärden, till exempel ett bolag med P/E 200. Ligger snittet långt från medianen finns det sådana avvikare, och då är medianen mer rättvisande."],
  peerMedian:["Branschmedian","Mittenvärdet bland bolagen i branschen. Hälften ligger över och hälften under. Påverkas mindre av extremvärden än ett vanligt snitt."],
  themes:["Teman","Aktierna grupperas i teman utifrån bransch, t.ex. Halvledare eller Försvar & flyg. Tabellen visar medianen för temats aktier. Klicka på ett tema för att se de största vinnarna och förlorarna."],
  heat:["Värme","Hur starkt temat gått: senaste veckan väger 20 %, senaste månaden 50 % och tre månader 30 %. De två bästa temana är Hetast, de två sämsta Kallast."],
  above200:["Över 200W","Andel av temats aktier som handlas över sitt 200-veckorssnitt. Högt = bred styrka i temat. Lågt = temat är nedtryckt, vilket kan ge köplägen enligt 200W-strategin."],
  ruleFair:["Förbättrad säljregel","Backtestet visar att det lönar sig att sälja redan vid Fair Value (30 % över 200W) i stället för att vänta på Expensive (40 %). Kortare affärer, fler vinster hemtagna och mindre tid i marknaden när den vänder."],
  ruleStop:["Stop −20 %","Sälj om aktien faller 20 % från köpkursen. Med 2x hävstång blir det cirka −40 % på din insats. I backtestet tog stoppen bort de värsta fallen (−50 % och mer) utan att sänka avkastningen nämnvärt."],
  dominance:["Dominans i branschen","Bolagen i samma bransch sorterade efter omsättning (börsvärde delat med P/S). Andel = bolagets del av branschens samlade omsättning bland sidans bolag. Förklaringen jämför ledarens marginaler, avkastning på kapitalet och tillväxt med branschens median."],
  btAnn:["Median årstakt","Varje affärs avkastning omräknad till takt per år, sedan medianen. Korta vinnande affärer ger höga tal. Jämför mellan reglerna, inte med en portföljs avkastning."],
  btLev:["Med 2x hävstång","Dubbla veckorörelser minus 5 % ränta per år på den lånade delen. Visar det värsta fallet under en affär. Ett fall på −50 % eller mer kan ge margin call."],
  mdd:["Max drawdown","Största fallet från en topp till en senare botten för portföljen med dagens vikter. Med 2x hävstång blir fallet ungefär dubbelt så stort."],
  top3:["Topp 3-koncentration","Hur stor del av värdet som ligger i de tre största innehaven. Över 60 % betyder att några få aktier avgör hela resultatet."],
  riskShare:["Andel av risken","Hur stor del av portföljens svängningar som kommer från aktien, med hänsyn till hur den rör sig ihop med de andra. Är andelen av risken mycket större än andelen av värdet tar aktien mer risk än den borde."],
  sharpe:["Sharpekvot","Avkastning över riskfri ränta delat med volatiliteten. Hur mycket betalt du får per enhet risk. Över 1 är bra, över 2 mycket bra."],
  sortino:["Sortinokvot","Som Sharpe men räknar bara svängningar nedåt som risk. Uppgångar straffas inte."],
  corr:["Korrelation","Hur lika innehaven rör sig, från −1 (helt olika) till +1 (exakt lika). Med hög korrelation faller allt samtidigt, och spridningen skyddar inte."],
  focus:["Claudes fokus","Varje vardag morgon går Claude igenom aktierna som klarar Lower Risk (Low Risk, High Reward) eller är nära, och som ligger i 200W-köpzonen. Claude läser senaste nyheterna och lyfter de som är mest intressanta just nu, plus kommentarer till dina swingar. Köpläge = klarar strategin och ligger i köpzonen. Bevaka = nära köpzon eller missar ett krav. Undvik = fallet ser fundamentalt motiverat ut."],
  fairValue:["Beräknat värde","DCF-värdet per aktie i basfallet, jämfört med dagens kurs."],
  eps:["EPS, vinst per aktie","Bolagets vinst delat med antalet aktier. Över tid brukar kursen följa vinsten: växer vinsten och kursen står still blir aktien billigare (lägre P/E), och tvärtom."],
  insiders:["Insiders","Personer i ledningen, styrelsen och storägare som köper och säljer aktier i bolaget. Uppgifterna kommer från de amerikanska Form 4-anmälningarna via Yahoo Finance. Köp med egna pengar är en stark signal, försäljningar säger mindre eftersom de ofta är planerade i förväg eller görs för att betala skatt på aktielöner."],
  keyVerdict:["Bra eller dåligt?","Varje nyckeltal jämförs med bolagen i samma bransch bland sidans aktier. Bra = bland den bästa tredjedelen, Svag = bland den sämsta tredjedelen, Okej = mitten. Omdömet vägs mot tumregler (t.ex. ROIC över 15 % är bra, P/E över 35 är dyrt) så att ett nyckeltal inte blir Bra bara för att hela branschen är svag. Med för få jämförbara bolag används bara tumreglerna. För värdering är lägre bättre, för lönsamhet och tillväxt högre."],
  mine:["Mina aktier","Aktier du följer, med kurs, 52-veckorsspann, värdering, sentiment och jämförelse med branschen. Lägg till med sökrutan eller ☆ på en aktie."],
  valVerdict:["Värdering: undervärderad eller inte","Sammanvägning av upp till sex mått, var och en från −100 (dyr) till +100 (billig): DCF-värde mot kurs, analytikernas riktkurs (minus 10 % eftersom riktkurser brukar ligga högt), P/E framåt mot branschmedianen (väger 1,5), PEG, avstånd till 200W och Value-faktorn. Över +25 = Undervärderad, under −25 = Övervärderad, annars Rimligt värderad. Öppna raden för att se varje del."],
  sentiment:["Sentiment: bullish eller bearish","Hur marknaden och analytikerna lutar just nu: analytikernas betyg, ändring av vinstprognosen senaste 30 dagarna (väger 1,5), momentum 12 månader exklusive senaste månaden, kursen 3 månader, trend (kurs mot 50- och 200-dagars snitt) och blankning. Över +15 = Bullish, över +45 = Starkt bullish, under −15 = Bearish, under −45 = Starkt bearish."],
  quant:["Quant-poäng","Sammanvägd faktorpoäng 0–100 mot alla aktier på sidan, som en kvantfond rankar aktier. Value, Growth, Quality och Momentum väger 1, Revisions och Low risk 0,5. 50 = genomsnittsaktien, 80 = bättre än 80 % av aktierna. Ett rankingverktyg, inte en köpsignal."],

/* ============ strategilogik ============ */
function test(c,d,v){
  const x=d[c.f];
  if(c.nullOk&&x==null)return true;
  if(!nn(x))return false;
  if(c.de&&(d.negEquity||x<0))return false;
  if(c.pos&&x<=0)return false;
  return c.op==="≥"?x>=v:c.op===">"?x>v:c.op==="≤"?x<=v:x<v;
}
function zoneOf(dist){if(!nn(dist))return null;const z=lim.zones;return dist<0?"fire":dist<z.b1?"vcheap":dist<z.b2?"cheap":dist<z.b3?"fair":dist<z.b4?"exp":"vexp"}
function growthScore(d){let s=0;
  if(nn(d.revCagr))s+=clamp(d.revCagr/40,0,1)*15; if(nn(d.revGrowth1y))s+=clamp(d.revGrowth1y/50,0,1)*15;
  if(nn(d.roic))s+=clamp(d.roic/30,0,1)*10; if(nn(d.fcfMargin))s+=clamp(d.fcfMargin/30,0,1)*10;
  if(nn(d.grossMargin))s+=clamp((d.grossMargin-20)/60,0,1)*5; if(nn(d.peg)&&d.peg>0)s+=clamp((3-d.peg)/2.5,0,1)*15;
  if(nn(d.fwdPe)&&d.fwdPe>0)s+=clamp((80-d.fwdPe)/60,0,1)*10; if(!d.negEquity&&nn(d.de))s+=clamp((2-d.de)/2,0,1)*12;
  s+=d.shareChange==null?4:clamp((10-d.shareChange)/10,0,1)*8; return Math.round(s)}
function qualityScore(d){let s=0;
  if(nn(d.roe))s+=clamp(d.roe/40,0,1)*25; if(nn(d.peg)&&d.peg>0)s+=clamp((2-d.peg)/1.7,0,1)*25;
  if(nn(d.fcfMargin))s+=clamp(d.fcfMargin/30,0,1)*15; if(!d.negEquity&&nn(d.de))s+=clamp((1.5-d.de)/1.5,0,1)*15;
  if(nn(d.earnGrowth1y))s+=clamp(d.earnGrowth1y/30,0,1)*10; if(nn(d.revGrowth1y))s+=clamp(d.revGrowth1y/20,0,1)*10;
  return Math.round(s)}
let LEAD={};   // branschledare: {ticker: 1 eller 2} efter omsättning bland sidans bolag
const revEst=d=>nn(d.mcapB)&&nn(d.ps)&&d.ps>0?d.mcapB/d.ps:null;
function computeLeaders(){
  const by={};rows.forEach(d=>{if(!d.industry||(d.type&&d.type!=="EQUITY"))return;const r=revEst(d);if(r)(by[d.industry]=by[d.industry]||[]).push([r,d.ticker])});
  LEAD={};Object.values(by).forEach(l=>{l.sort((a,b)=>b[0]-a[0]);l.slice(0,2).forEach(([,t],i)=>LEAD[t]=i+1)});
}
function classify(d){
  d.res={};
  const ret=Math.max(nn(d.roic)?d.roic:-99,nn(d.roe)?d.roe:-99);d.gRet=ret>-99?ret:null;
  d.gBig=(d.mcapB||0)>=200||(LEAD[d.ticker]&&(d.mcapB||0)>=50)?1:0;
  d.gDebt=(!d.negEquity&&nn(d.de)&&d.de<1.5)||(d.negEquity&&(d.roic||0)>=20)?1:0;
  for(const k in STRATS){
    if(d.excluded){d.res[k]={miss:["sector"],status:"excl"};continue}
    const miss=STRATS[k].crit.filter(c=>!test(c,d,lim[k][c.k])).map(c=>c.k);
    d.res[k]={miss,status:!miss.length?"pass":miss.length===1?"near":"out"};
  }
  d.gScore=d.excluded?null:growthScore(d);d.qScore=d.excluded?null:qualityScore(d);
  d.z=zoneOf(d.dist200w);
  d.sig=[];
  if(nn(d.dist200w)){
    if(d.res.lrhr.status==="pass"&&d.dist200w<lim.zones.swing)d.sig.push("swing");
    if(d.res.ftp.status==="pass"&&d.dist200w<lim.zones.rea)d.sig.push("rea");
    if(d.res.gold.status==="pass"&&d.dist200w<lim.zones.swing)d.sig.unshift("guld");
    if(d.res.lrhr.status==="pass"&&d.dist200w<0)d.sig.unshift("diamant");
  }
  d.flag=nn(d.peg)&&d.peg>0&&d.peg<0.2;
}
const level=(d,p)=>nn(d.ma200w)?d.ma200w*(1+p/100):null;
const scoreOf=(d,k)=>STRATS[k].score==="quality"?d.qScore:d.gScore;
const shortName=(s,k)=>k==="sector"?"Sektor":(STRATS[s].crit.find(c=>c.k===k)||{}).short||k;
function critVal(k,d){if(k==="big")return d.gBig?(nn(d.mcapB)&&d.mcapB>=200?"Mega":"Ledare"):"Nej";if(k==="debt")return d.gDebt?"Ja":"Nej";if(k==="ret")return nn(d.gRet)?f(d.gRet,1):"saknas";const c=Object.values(STRATS).flatMap(s=>s.crit).find(c=>c.k===k);if(!c)return"";if(c.de&&d.negEquity)return"neg. EK";const v=d[c.f];return nn(v)?f(v,k==="pegMax"||k==="deMax"?2:1):"saknas"}
function dropTo(d,p){const t=level(d,p);return nn(t)&&nn(d.price)&&d.price>t?(1-t/d.price)*100:0}

function verdict(w,rev,vol){
  const s=vol*Math.sqrt(w.h);
  const parts=[["marknaden",w.mkt],["sektorn",w.sec],["bolagsspecifikt",w.idio]].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if(Math.abs(w.z)<1.5){
    if(Math.abs(w.r)<s*0.8)return["Ingen tydlig rörelse","Rörelsen ligger inom aktiens normala svängningar."];
    if(parts[0][0]!=="bolagsspecifikt")return["Makro/sektor",`Det mesta förklaras av ${parts[0][0]}. Sådana rörelser brukar inte ändra bolagets långsiktiga värde.`];
  }
  if(Math.abs(w.z)>=1.5){
    if(w.idio<0){if(rev==null)return["Blandat","Ovanligt bolagsspecifikt fall, men prognosdata saknas för att avgöra om det är motiverat."];
      return rev>-1?["Möjlig överreaktion",`Ovanligt stort bolagsspecifikt fall (${f(Math.abs(w.z),1)} standardavvikelser) medan analytikernas vinstprognos ${rev>=0?"höjts":"bara sänkts"} ${f(Math.abs(rev),1," %")}.`]:["Fundamentalt motiverat",`Kursfallet följs av sänkta vinstprognoser (${f(rev,1," %")}). Marknaden prisar in sämre utsikter.`]}
    if(rev==null)return["Blandat","Ovanligt bolagsspecifik uppgång, men prognosdata saknas."];
    return rev<1?["Uppgång utan stöd i prognoserna",`Kursen har stigit ${f(Math.abs(w.z),1)} standardavvikelser mer än väntat, men vinstprognosen har bara ändrats ${pct(rev,1)}. Risk för rekyl.`]:["Fundamentalt stöd",`Uppgången följs av höjda vinstprognoser (${pct(rev,1)}).`];
  }
  return["Blandat","Både marknad och bolagsspecifika faktorer bidrar, utan att något sticker ut statistiskt."];
}

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function hexA(c,a){if(c.startsWith("#")){let h=c.slice(1);if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}return c}
class ZoneBands{
  constructor(){this.pts=[];this.fire=[];this.cols=[];this._v=[{zOrder:()=>"bottom",renderer:()=>({draw:t=>this.draw(t)})}]}
  attached(p){this.chart=p.chart;this.series=p.series}
  paneViews(){return this._v}
  updateAllViews(){}
  set(pts,fire,cols){this.pts=pts;this.fire=fire;this.cols=cols}
  draw(target){
    if(!this.chart||!this.pts.length)return;
    const ts=this.chart.timeScale(),s=this.series;
    target.useBitmapCoordinateSpace(sc=>{
      const ctx=sc.context,hr=sc.horizontalPixelRatio,vr=sc.verticalPixelRatio,H=sc.bitmapSize.height;
      const sp=ts.options().barSpacing*hr;
      // Fire Sale-bakgrund
      ctx.fillStyle=this.cols.fire;
      for(const t of this.fire){const x=ts.timeToCoordinate(t);if(x==null)continue;ctx.fillRect(Math.round(x*hr-sp/2),0,Math.ceil(sp)+1,H)}
      // zonband
      const xy=this.pts.map(p=>({x:ts.timeToCoordinate(p.t),y:p.v.map(v=>s.priceToCoordinate(v))})).filter(p=>p.x!=null);
      if(xy.length<2)return;
      for(let b=0;b<this.cols.bands.length;b++){
        ctx.beginPath();
        xy.forEach((p,i)=>{const x=p.x*hr,y=p.y[b+1]*vr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
        for(let i=xy.length-1;i>=0;i--)ctx.lineTo(xy[i].x*hr,xy[i].y[b]*vr);
        ctx.closePath();ctx.fillStyle=this.cols.bands[b];ctx.fill();
      }
    });
  }
}
function buildBars(d,det){
  const D=det.d,W=det.w;
  let daily=D.t.map((t,i)=>({t,o:D.o[i],h:D.h[i],l:D.l[i],c:D.c[i],v:D.v?D.v[i]:0}));
  let weekly=W.t.map((t,i)=>({t,o:W.o[i],h:W.h[i],l:W.l[i],c:W.c[i]}));
  const lb=d.lastBar;
  if(lb&&daily.length){
    const last=daily[daily.length-1];
    if(lb.t===last.t)Object.assign(last,{o:lb.o,h:lb.h,l:lb.l,c:lb.c});else if(lb.t>last.t)daily.push({t:lb.t,o:lb.o,h:lb.h,l:lb.l,c:lb.c,v:0});
    const wk=weekly[weekly.length-1],wkEnd=t=>t+((5-((t+4)%7))+7)%7; // fredag i samma vecka (dag 0 = torsdag)
    if(wk&&wkEnd(lb.t)===wk.t){wk.h=Math.max(wk.h,lb.h);wk.l=Math.min(wk.l,lb.l);wk.c=lb.c}
    else if(wk&&lb.t>wk.t)weekly.push({t:wkEnd(lb.t),o:lb.o,h:lb.h,l:lb.l,c:lb.c});
  }
  return{daily,weekly};
}
function maSeries(weekly,daily,tf){
  const c=weekly.map(w=>w.c),N=c.length,pre=[0];for(let i=0;i<N;i++)pre.push(pre[i]+c[i]);
  const maW=i=>i>=199?(pre[i+1]-pre[i-199])/200:null;
  if(tf==="W")return weekly.map((w,i)=>({t:w.t,ma:maW(i),c:w.c}));
  // dag: utvecklande snitt = 199 hela veckor före + dagens kurs (som request.security i TradingView)
  let j=0;const out=[];
  for(const b of daily){
    while(j<N&&weekly[j].t<b.t)j++; // j = veckan som innehåller dagen (veckor slutar på fredag)
    const k=Math.min(j,N-1);
    const ma=k>=199?(pre[k]-pre[k-199]+b.c)/200:null;
    out.push({t:b.t,ma,c:b.c});
  }
  return out;
}

let FXB=store.get("ft5-fx",{});
async function ensureFx(){
  const need=[...new Set(rows.map(d=>d.currency).concat(allPos().map(p=>p.cur)).filter(c=>c&&c!=="SEK"))];
  const missing=need.filter(c=>!(U.fx&&U.fx[c]));
  if(!missing.length)return false;
  if(FXB._t&&Date.now()-FXB._t<864e5&&missing.every(c=>FXB[c]))return false;
  try{
    const r=await fetch("https://api.frankfurter.app/latest?from=SEK&to="+encodeURIComponent(missing.join(",")));
    if(!r.ok)return false;const j=await r.json(),out={_t:Date.now()};
    for(const c in j.rates||{})if(j.rates[c]>0)out[c]=+(1/j.rates[c]).toFixed(6);
    FXB=out;store.set("ft5-fx",out);return true;
  }catch(e){return false}
}
const kr=(x,dp=0)=>nn(x)?f(x,dp)+" kr":"–";
const krS=x=>!nn(x)?"–":Math.abs(x)<0.5?"0 kr":(x>0?"+":"−")+f(Math.abs(x),0)+" kr";
function posCalc(p){
  const d=bySym[p.ticker]||{},fx=fxOf(d.currency||p.cur),price=d.price;
  const value=nn(price)&&fx?p.qty*price*fx:null;
  const invested=nn(p.sek)?p.sek:(fx?p.qty*p.price*fx:null);
  const pl=nn(value)&&nn(invested)?value-invested:null;
  const plPct=nn(pl)&&invested?pl/invested*100:null;
  const today=nn(price)&&nn(d.prevClose)&&fx?p.qty*(price-d.prevClose)*fx:null;
  const days=p.date?Math.max(0,Math.round((Date.now()-new Date(p.date))/864e5)):null;
  const flags=[];
  if(nn(p.stop)&&nn(price)&&price<=p.stop)flags.push(["Under stop","no"]);
  if(nn(p.target)&&nn(price)&&price>=p.target)flags.push(["Mål nått","ok"]);
  if(d.z==="vexp")flags.push(["Very Expensive","no"]);
  if(d.nextEarnings){const dd=Math.round((new Date(d.nextEarnings)-Date.now())/864e5);if(dd>=0&&dd<=7)flags.push([`Rapport om ${dd} d`,"warn"])}
  return{d,fx,price,value,invested,pl,plPct,today,days,flags};
}
function posTotals(list){
  let inv=0,val=0,tod=0,n=0;
  for(const p of list){const c=posCalc(p);if(nn(c.value)&&nn(c.invested)){inv+=c.invested;val+=c.value;tod+=c.today||0;n++}}
  if(!n&&list.length)return{inv:null,val:null,pl:null,plPct:null,tod:null,n};  // inget kunde värderas (t.ex. valutakurs saknas): visa – i stället för 0 kr
  return{inv,val,pl:val-inv,plPct:inv?(val-inv)/inv*100:null,tod,n};
}

const THEME_RULES=[
  [/semiconductor equipment/i,"Halvledarutrustning"],[/semiconductor/i,"Halvledare"],
  [/software/i,"Mjukvara"],[/information technology services/i,"IT-tjänster"],
  [/internet content|internet retail|electronic gaming|advertising/i,"Internet & e-handel"],
  [/communication equipment|computer hardware|electronic components|scientific & technical/i,"Hårdvara & nätverk"],
  [/drug manufacturers|biotechnology|pharmaceutical/i,"Läkemedel & bioteknik"],
  [/medical|diagnostics|health/i,"Medtech & vård"],
  [/aerospace|defense/i,"Försvar & flyg"],
  [/bank|insurance|asset management|capital markets|credit services|financial/i,"Finans"],
  [/oil|gas|uranium|coal/i,"Energi"],[/utilities/i,"Kraft & el"],[/reit|real estate/i,"Fastigheter"],
  [/telecom/i,"Telekom"],[/entertainment|broadcasting|publishing/i,"Media & underhållning"],
  [/restaurant|apparel|footwear|specialty retail|home improvement|discount stores|auto|travel|resorts|leisure|luxury|department/i,"Konsument"],
  [/beverages|household|packaged foods|tobacco|confectioners|farm products|grocery/i,"Dagligvaror"],
  [/chemical|steel|gold|copper|aluminum|building materials|packaging|lumber|agricultural/i,"Råvaror & material"],
  [/machinery|electrical equipment|industrial|engineering|construction|railroads|freight|trucking|airlines|conglomerates|building products|waste|security|business services|staffing|tools/i,"Industri"]
];
function themeOf(d){if(d.type&&d.type!=="EQUITY")return null;const i=d.industry||"";for(const [re,t] of THEME_RULES)if(re.test(i))return t;return d.sector&&d.sector!=="Övrigt"?d.sector:null}
const avgOf=a=>{const v=a.filter(nn);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
const med=a=>{const v=a.filter(nn).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2};
function computeThemes(){
  const g={};
  rows.forEach(d=>{const t=themeOf(d);if(!t)return;(g[t]=g[t]||[]).push(d)});
  const out=Object.entries(g).filter(([,m])=>m.length>=4).map(([name,m])=>{
    const r5=med(m.map(d=>d.r5)),r21=med(m.map(d=>d.r21)),r63=med(m.map(d=>d.r63));
    const wsum=(nn(r5)?.2:0)+(nn(r21)?.5:0)+(nn(r63)?.3:0);
    const mom=wsum?((nn(r5)?r5*.2:0)+(nn(r21)?r21*.5:0)+(nn(r63)?r63*.3:0))/wsum:null;
    const withMa=m.filter(d=>nn(d.dist200w));
    const rev=m.map(d=>d.epsRev30).filter(nn);
    return{name,m,n:m.length,r5,r21,r63,mom,above:withMa.length?withMa.filter(d=>d.dist200w>0).length/withMa.length*100:null,dist:med(m.map(d=>d.dist200w)),
      rev:rev.length>=3?med(rev):null,pe:med(m.map(d=>d.fwdPe>0?d.fwdPe:null)),sig:m.filter(d=>(d.sig||[]).length).length};
  }).sort((a,b)=>(b.mom??-9)-(a.mom??-9));
  const k=out.filter(t=>nn(t.mom)).length;
  out.forEach((t,i)=>{t.heat=!nn(t.mom)?"–":(i<2&&t.mom>0)?"Hetast":(i<Math.ceil(k*0.3)&&t.mom>0)?"Het":(i>=k-2&&t.mom<0)?"Kallast":(i>=Math.floor(k*0.7)&&t.mom<0)?"Sval":"Neutral"});
  return out;
}
const HEATCLS={"Hetast":"background:var(--z-vexp-bg);color:var(--z-vexp)","Het":"background:var(--z-exp-bg);color:var(--z-exp)","Neutral":"background:var(--sunk);color:var(--muted)","Sval":"background:var(--z-vcheap-bg);color:var(--z-vcheap)","Kallast":"background:var(--z-vcheap-bg);color:var(--z-vcheap);font-weight:700"};

/* ---- branschjämförelse ---- */
const PEERM=[
  ["Tillväxt",[["revGrowth1y","Omsättning 1 år",1,"%"],["revCagr","Omsättning per år (3–5 år)",1,"%"],["earnGrowth1y","Vinst per aktie 1 år",1,"%"]]],
  ["Lönsamhet",[["grossMargin","Bruttomarginal",1,"%"],["opMargin","Rörelsemarginal",1,"%"],["fcfMargin","FCF-marginal",1,"%"],["roe","ROE",1,"%"],["roic","ROIC",1,"%"],["_rule40","Rule of 40",1,"%"]]],
  ["Värdering",[["fwdPe","P/E framåt",-1,"",1],["peg","PEG",-1,"",1],["evEbitda","EV/EBITDA",-1,"",1],["ps","P/S",-1,"",1],["_fcfYield","FCF-avkastning",1,"%"]]],
  ["Risk",[["de","Skuld / eget kapital",-1,"",0,1],["beta","Beta",-1,""]]],
  ["Kurs",[["r21","Kurs 1 månad",1,"r"],["r63","Kurs 3 månader",1,"r"],["r12_1","Momentum 12–1 månader",1,"r"],["dist200w","Avstånd till 200W",-1,"%"]]]
];
const PEER_GL={revGrowth1y:"revGrowth1y",revCagr:"revCagr",earnGrowth1y:"earnGrowth1y",grossMargin:"grossMargin",opMargin:"opMargin",fcfMargin:"fcfMargin",roe:"roe",roic:"roic",fwdPe:"fwdPe",peg:"peg",evEbitda:"evEbitda",ps:"ps",de:"de",beta:"beta",dist200w:"dist200w",_rule40:"rule40",_fcfYield:"fcfYield",pb:"pb"};
const DERIV={
  _rule40:d=>nn(d.revGrowth1y)&&nn(d.fcfMargin)?d.revGrowth1y+d.fcfMargin:null,
  _fcfYield:d=>nn(d.fcfMargin)&&nn(d.ps)&&d.ps>0?d.fcfMargin/d.ps:null   // FCF/börsvärde = FCF-marginal / (börsvärde/omsättning)
};
const FIN_SKIP=new Set(["roic","grossMargin","opMargin","fcfMargin","evEbitda","ps","de","_rule40","_fcfYield"]);
function peerMetrics(d){
  const fin=d.sector==="Finans"||d.sectorEn==="Financial Services",tech=d.sector==="Teknik"||d.sectorEn==="Technology"||/software/i.test(d.industry||"");
  return PEERM.map(([g,ms])=>[g,ms.filter(m=>fin?!FIN_SKIP.has(m[0]):m[0]!=="_rule40"||tech).concat(fin&&g==="Värdering"?[["pb","P/B (kurs / eget kapital)",-1,"",1]]:[])]).filter(x=>x[1].length);
}
function quant(vals,q){const s=vals.slice().sort((a,b)=>a-b);if(!s.length)return null;const i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function peerVal(d,m){const [k,, ,,pos,deOnly]=m;let v=k[0]==="_"?DERIV[k](d):d[k];if(!nn(v))return null;if(pos&&v<=0)return null;if(deOnly&&d.negEquity)return null;return v}
function peerGroup(d){
  const eq=r=>r.type==="EQUITY"||!r.type;
  if(d.industry){const p=rows.filter(r=>eq(r)&&r.industry===d.industry);if(p.length>=5)return{label:d.industry,kind:"bransch",peers:p}}
  const t=themeOf(d);if(t){const p=rows.filter(r=>eq(r)&&themeOf(r)===t);if(p.length>=5)return{label:t,kind:"tema",peers:p}}
  const p=rows.filter(r=>eq(r)&&r.sector===d.sector);return{label:d.sector||"–",kind:"sektor",peers:p};
}
function peerScores(peers,d){
  // sammanvägd percentil per bolag över tillväxt, lönsamhet, värdering och risk (branschanpassade nyckeltal)
  const ms=peerMetrics(d||peers[0]||{}).filter(g=>g[0]!=="Kurs").flatMap(g=>g[1]);const sc=new Map();
  ms.forEach(m=>{const vals=peers.map(p=>[p,peerVal(p,m)]).filter(x=>x[1]!=null).sort((a,b)=>(a[1]-b[1])*m[2]*-1);
    vals.forEach(([p],i)=>{const pctl=vals.length>1?1-i/(vals.length-1):0.5;const s=sc.get(p)||[];s.push(pctl);sc.set(p,s)})});
  const arr=peers.map(p=>{const s=sc.get(p)||[];return{p,score:s.length>=5?s.reduce((a,b)=>a+b,0)/s.length:null}}).filter(x=>x.score!=null).sort((a,b)=>b.score-a.score);
  arr.forEach((x,i)=>x.rank=i+1);return arr;
}
function industryRank(d){
  if(d._ir!==undefined)return d._ir;
  const g=peerGroup(d);const sc=peerScores(g.peers,d);const me=sc.find(x=>x.p===d);
  return d._ir=me?{rank:me.rank,n:sc.length,label:g.label,kind:g.kind}:null;
}
function renderPeers(d){
  const g=peerGroup(d),peers=g.peers,sc=peerScores(peers,d),me=sc.find(x=>x.p===d);
  const fmtV=(v,u)=>!nn(v)?"–":u==="r"?pct(v*100,1):u==="%"?f(v,1," %"):f(v,v>=100?0:2);
  const rowsH=peerMetrics(d).map(([grp,ms])=>`<tr><td colspan="8" class="l" style="background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)">${grp}</td></tr>`+ms.map(m=>{
    const v=peerVal(d,m),vals=peers.map(p=>peerVal(p,m)).filter(x=>x!=null),md=med(vals),mn=avgOf(vals),q1=quant(vals,0.25),q3=quant(vals,0.75);
    const qs=`<td class="r n muted">${fmtV(q1,m[3])}</td><td class="r n muted">${fmtV(md,m[3])}</td><td class="r n muted">${fmtV(mn,m[3])}</td><td class="r n muted">${fmtV(q3,m[3])}</td>`;
    if(v==null)return `<tr><td class="l">${esc(m[1])}${ib(PEER_GL[m[0]])}</td><td class="r n">–</td>${qs}<td class="r n faint">–</td><td></td></tr>`;
    const sorted=vals.slice().sort((a,b)=>(a-b)*m[2]*-1),rank=sorted.findIndex(x=>x===v)+1,n=sorted.length;
    const pctl=n>1?1-(rank-1)/(n-1):0.5,good=pctl>=0.67,bad=pctl<=0.33;
    return `<tr><td class="l">${esc(m[1])}${ib(PEER_GL[m[0]])}</td><td class="r n ${good?"ok":bad?"no":""}">${fmtV(v,m[3])}</td>${qs}<td class="r n">${rank} av ${n}</td><td style="min-width:110px"><div class="pbar"><i style="left:${pctl*100}%;background:${good?"var(--up)":bad?"var(--down)":"var(--ink)"}"></i></div></td></tr>`}).join("")).join("");
  const top=sc.slice(0,12);if(me&&!top.includes(me))top.push(me);
  const pes=peers.map(p=>p.fwdPe).filter(v=>nn(v)&&v>0&&v<200),mpe=med(pes);
  const peV=nn(d.fwdPe)&&d.fwdPe>0&&nn(mpe)&&pes.length>=5&&nn(d.price)?d.price*mpe/d.fwdPe:null;
  return `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px">
      <h3 style="font-size:15px">${me?`Plats ${me.rank} av ${sc.length}`:"Rank saknas"} i ${esc(g.label)}${ib("industryRank")}</h3>

const FACT=[["V","Value","Billig mot vinst, kassaflöde och EBITDA"],["G","Growth","Omsättnings- och vinsttillväxt"],["Q","Quality","ROIC, marginaler och låg skuld"],["M","Momentum","Kurstrend 1–12 månader"],["R","Revisions","Prognosändringar och analytikerbetyg"],["L","Low risk","Låg beta, volatilitet och drawdown"]];

const QM={
  V:[d=>nn(d.fwdPe)&&d.fwdPe!==0?100/d.fwdPe:null,d=>nn(d.fcfMargin)&&nn(d.ps)&&d.ps>0?d.fcfMargin/d.ps:null,d=>nn(d.evEbitda)&&d.evEbitda>0?100/d.evEbitda:null,d=>nn(d.peg)&&d.peg>0?1/d.peg:null],
  G:[d=>d.revGrowth1y,d=>d.revCagr,d=>d.earnGrowth1y],
  Q:[d=>d.roic,d=>d.grossMargin,d=>d.fcfMargin,d=>d.opMargin,d=>d.negEquity||!nn(d.de)?null:-d.de],
  M:[d=>nn(d.r12_1)?d.r12_1:d.r252,d=>d.r126,d=>nn(d.r63)?d.r63:d.r21,d=>pos52(d),d=>nn(d.sma200)&&d.sma200>0&&nn(d.price)?d.price/d.sma200-1:null],
  R:[d=>d.epsRev30,d=>nn(d.recMean)&&(d.nAnalysts||0)>=3?-d.recMean:null],

const QW={V:1,G:1,Q:1,M:1,R:.5,L:.5};
function pos52(d){return nn(d.hi52)&&nn(d.lo52)&&nn(d.price)&&d.hi52>d.lo52?clamp((d.price-d.lo52)/(d.hi52-d.lo52),0,1):null}
function pctRanks(vals){
  vals.sort((a,b)=>a[1]-b[1]);const n=vals.length,out=new Map();let i=0;
  while(i<n){let j=i;while(j+1<n&&vals[j+1][1]===vals[i][1])j++;const p=n>1?(i+j)/2/(n-1)*100:50;for(let k=i;k<=j;k++)out.set(vals[k][0],p);i=j+1}
  return out;
}
function computeQuant(){
  const eq=rows.filter(d=>(d.type||"EQUITY")==="EQUITY"),acc=new Map(eq.map(d=>[d,{}]));
  for(const F in QM)QM[F].forEach(fn=>{const v=[];eq.forEach(d=>{const x=fn(d);if(nn(x))v.push([d,x])});if(v.length<20)return;pctRanks(v).forEach((p,d)=>{const a=acc.get(d);(a[F]=a[F]||[]).push(p)})});
  // snitt av percentiler per faktor, sedan omrankat till 0–100 så att 50 = mitten av universumet
  const raw={};eq.forEach(d=>{const a=acc.get(d);d.fx={};for(const F in QM)if(a[F]&&a[F].length)(raw[F]=raw[F]||[]).push([d,a[F].reduce((x,y)=>x+y,0)/a[F].length])});
  for(const F in raw)pctRanks(raw[F]).forEach((p,d)=>{d.fx[F]=Math.round(p)});
  const comp=[];eq.forEach(d=>{let s=0,w=0,k=0;for(const F in QW)if(nn(d.fx[F])){s+=d.fx[F]*QW[F];w+=QW[F];k++}if(k>=3)comp.push([d,s/w])});

function peerMed(d,k){

}

}

/* ---- risk och exponering för swingar och portfölj ---- */
function riskCard(list){
  const c=list.map(p=>({p,c:posCalc(p)})).filter(x=>nn(x.c.value)&&x.c.value>0);
  if(!c.length)return"";
  const tot=c.reduce((s,x)=>s+x.c.value,0);c.forEach(x=>x.w=x.c.value/tot);
  const byT={};c.forEach(x=>{byT[x.p.ticker]=(byT[x.p.ticker]||0)+x.w});
  const ws=Object.entries(byT).sort((a,b)=>b[1]-a[1]),effN=1/ws.reduce((s,[,w])=>s+w*w,0);
  const wavg=fn=>{let s=0,w=0;c.forEach(x=>{const v=fn(x.c.d);if(nn(v)){s+=v*x.w;w+=x.w}});return w>=0.5?s/w:null};
  const beta=wavg(d=>d.beta),vol=wavg(d=>d.vol),fx={};FACT.forEach(([F])=>{fx[F]=wavg(d=>(d.fx||{})[F])});
  const grp=fn=>{const g={};c.forEach(x=>{const k=fn(x)||"Övrigt";g[k]=(g[k]||0)+x.w});return Object.entries(g).sort((a,b)=>b[1]-a[1])};
  const sec=grp(x=>themeOf(x.c.d)||x.c.d.sector),cur=grp(x=>x.c.d.currency||x.p.cur);
  const warn=[];
  if(ws.length>=3&&ws[0][1]>0.2)warn.push(`${ws[0][0]} är ${f(ws[0][1]*100,0)} % av värdet. Många begränsar en enskild position till 10–20 %.`);
  if(sec.length&&sec[0][1]>0.4&&c.length>=3)warn.push(`${sec[0][0]} är ${f(sec[0][1]*100,0)} % av värdet. Hög temarisk: en dålig dag för temat slår mot hela listan.`);
  if(nn(beta)&&beta>1.4)warn.push(`Vägd beta ${f(beta,2)}: listan rör sig i snitt ${f(beta,1)} gånger så mycket som börsen.`);
  const bars=arr=>`<div class="fprof">${arr.slice(0,7).map(([k,w])=>`<div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><span class="tr"><i style="width:${w*100}%;background:var(--accent)"></i></span><span class="n small" style="text-align:right">${f(w*100,0)} %</span></div>`).join("")}</div>`;
  return `<section class="card" style="margin-top:16px"><div class="hd"><h2>Risk och exponering${ib("portRisk")}</h2><span class="sub">Vägt efter värde i kronor</span></div><div class="bd">
    <div class="tiles">
      <div><span class="sub">Beta${ib("beta")}</span><b class="n">${f(beta,2)}</b><span class="small muted">1 = som börsen</span></div>
      <div><span class="sub">Volatilitet${ib("vol")}</span><b class="n">${nn(vol)?f(vol,0," %"):"–"}</b><span class="small muted">vägd, per år</span></div>
      <div><span class="sub">Effektivt antal${ib("effN")}</span><b class="n">${f(effN,1)}</b><span class="small muted">av ${ws.length} aktier</span></div>
      <div><span class="sub">Största position</span><b class="n">${f(ws[0][1]*100,0)} %</b><span class="small muted">${esc(ws[0][0])}</span></div>
    </div>
    ${warn.length?`<ul class="small" style="margin:12px 0 0;padding-left:18px;color:var(--warn);line-height:1.55">${warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}
    <div class="xgrid" style="margin-top:12px"><div><h4>Teman</h4>${bars(sec)}</div><div><h4>Valuta</h4>${bars(cur)}</div><div><h4>Faktorexponering${ib("factors")}</h4>${fprof(fx)}</div></div>
  </div></section>`;
}


/* ---- EPS mot kurs ---- */
function epsPoints(det){
  const q=(det.epsq||[]).filter(x=>nn(x.a)&&x.d).sort((a,b)=>a.d<b.d?-1:1),day=s=>Math.floor(Date.parse(s)/864e5);
  const ttm=[];
  for(let i=3;i<q.length;i++){if(day(q[i].d)-day(q[i-3].d)>400)continue;ttm.push({t:day(q[i].d),v:q[i].a+q[i-1].a+q[i-2].a+q[i-3].a})}
  if(ttm.length>=2)return{kind:"ttm",pts:ttm,q};
  const fin=det.fin,today=Math.floor(Date.now()/864e5);
  if(fin&&fin.eps){const pts=fin.y.map((y,i)=>{const v=fin.eps[i];if(!nn(v))return null;const iso=fin.d&&fin.d[i]?fin.d[i]:`${y}-06-30`;return{t:Math.min(day(iso),today),v}}).filter(Boolean);if(pts.length>=2)return{kind:"year",pts,q}}
  return{kind:null,pts:[],q};
}
// rapportmarkörer som i TradingView: E under staplarna, grön = slog förväntan, röd = missade
function earnMarkers(det,cs,bars){
  const snap=t=>{const b=bars.find(x=>x.t>=t);return b?b.t:null},up=css("--up"),dn=css("--down"),mu=css("--muted");
  const mk=[];earnRows(det).forEach(x=>{const t=snap(x.t);if(t==null)return;
    mk.push({time:t*86400,position:"belowBar",shape:"circle",color:x.beat>0?up:x.beat<0?dn:mu,size:0.9,text:"E"+(nn(x.sp)?(x.sp>=0?" +":" −")+f(Math.abs(x.sp),0)+"%":"")})});
  mk.sort((a,b)=>a.time-b.time);const seen=new Set();cs.setMarkers(mk.filter(m=>!seen.has(m.time)&&seen.add(m.time)));
}
function epsOverlay(d,det,cs,bars,daily){
  const note=$("epsNote"),P=epsPoints(det);
  if(!P.pts.length){if(note)note.innerHTML=`<span class="muted">EPS-historik saknas för ${esc(d.ticker)} än. Den hämtas i nattkörningen och byggs på över tid.</span>`;return null}
  const T=b=>b.t*86400,snap=t=>{const b=bars.find(x=>x.t>=t);return b?b.t:null};
  const col=css("--z-fire"),up=css("--up"),dn=css("--down");
  chart.applyOptions({leftPriceScale:{visible:true,borderColor:css("--line"),scaleMargins:{top:.08,bottom:.12}}});
  const es=chart.addLineSeries({priceScaleId:"left",color:col,lineWidth:2,lineType:LightweightCharts.LineType.WithSteps,priceLineVisible:false,lastValueVisible:true,crosshairMarkerVisible:false,title:P.kind==="ttm"?"EPS 12m":"EPS år"});
  const m=new Map();P.pts.forEach(p=>{const t=snap(p.t);if(t!=null)m.set(t,p.v)});
  const lastBar=bars[bars.length-1].t,lastV=P.pts[P.pts.length-1].v;if(!m.has(lastBar))m.set(lastBar,lastV);
  const data=[...m.entries()].sort((a,b)=>a[0]-b[0]).map(([t,v])=>({time:t*86400,value:v}));
  es.setData(data);
  const tr=(det.est||{}).trend;
  if(tr&&nn(tr.cur)&&P.kind==="ttm")es.createPriceLine({price:tr.cur,color:col,lineStyle:2,lineWidth:1,axisLabelVisible:true,title:tr.period==="+1y"?"Prognos nästa år":"Prognos i år"});
  earnMarkers(det,cs,bars);
  const at=t=>{let v=null;for(const p of data){if(p.time<=t)v=p.value;else break}return v};
  if(note)note.innerHTML=epsNote(d,P,daily);
  return{at,col};
}
function epsNote(d,P,daily){
  const pts=P.pts,last=pts[pts.length-1],day=Math.floor(Date.now()/864e5);
  const yAgo=pts.filter(p=>p.t<=last.t-300).pop();
  const priceAt=t=>{let c=null;for(const b of daily){if(b.t<=t)c=b.c;else break}return c};
  const parts=[`<b style="color:var(--z-fire)">EPS ${P.kind==="ttm"?"12 mån":"senaste år"}</b> <span class="n">${f(last.v,2)}</span>`];
  if(yAgo&&yAgo.v>0&&last.v>0){
    const eg=(last.v/yAgo.v-1)*100,p0=priceAt(yAgo.t),p1=priceAt(last.t),pg=nn(p0)&&nn(p1)?(p1/p0-1)*100:null;
    parts.push(`vinsten ${eg>=0?"steg":"föll"} <span class="n ${cls(eg)}">${pct(eg,0)}</span> på ett år, kursen <span class="n ${cls(pg)}">${pct(pg,0)}</span> under samma tid.`);
    if(nn(pg)){const pe0=p0/yAgo.v,pe1=p1/last.v;
      parts.push(Math.abs(pg-eg)<10?`Kursen har följt vinsten (P/E ${f(pe0,0)} → ${f(pe1,0)}).`:pg<eg?`Kursen har gått sämre än vinsten, så aktien har blivit billigare (P/E ${f(pe0,0)} → ${f(pe1,0)}).`:`Kursen har gått bättre än vinsten, så aktien har blivit dyrare (P/E ${f(pe0,0)} → ${f(pe1,0)}).`)}
  }
  // samvariation: kurs mot EPS vid varje rapport (logaritmer)
  const xy=pts.filter(p=>p.v>0).map(p=>[Math.log(p.v),Math.log(priceAt(p.t)||NaN)]).filter(a=>isFinite(a[1]));
  if(xy.length>=6){const n=xy.length,mx=xy.reduce((s,a)=>s+a[0],0)/n,my=xy.reduce((s,a)=>s+a[1],0)/n;let sxy=0,sx=0,sy=0;xy.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sx+=(x-mx)**2;sy+=(y-my)**2});
    const r=sx&&sy?sxy/Math.sqrt(sx*sy):null;
    if(nn(r))parts.push(`Samvariation kurs–EPS över ${n} ${P.kind==="ttm"?"rapporter":"år"}: <b class="n">${f(r,2)}</b> (${r>0.7?"kursen har tydligt följt vinsten":r>0.3?"kursen har delvis följt vinsten":"kursen har i stort sett gått sin egen väg"}).`)}
  const q=P.q.filter(x=>nn(x.e)).slice(-8);
  if(q.length>=4){const beat=q.filter(x=>x.a>=x.e).length;parts.push(`Slog förväntningarna ${beat} av de ${q.length} senaste rapporterna.`)}
  if(P.kind==="year")parts.push(`<span class="muted">Årlig EPS tills kvartalshistoriken har hämtats.</span>`);
  return parts.join(" ");
}

function oppOf(d){if(d._opp!==undefined)return d._opp;
  if((d.type&&d.type!=="EQUITY")||d.excluded&&false)return d._opp=null;
  const P=[],why=[],add=(s,w)=>{if(nn(s))P.push([clamp(s,0,1),w])};
  const pm=peerMed(d,"fwdPe");
  if(nn(d.fwdPe)&&d.fwdPe>0&&nn(pm.m)&&pm.n>=4){const rel=d.fwdPe/pm.m;add((1.3-rel)/0.8,20);if(rel<0.85)why.push(`P/E ${f(d.fwdPe,1)} mot branschens ${f(pm.m,1)}${nn(pm.a)?` (snitt ${f(pm.a,1)})`:""}`)}
  else if(nn(d.fwdPe)&&d.fwdPe<0)add(0,20);
  if(nn(d.peg)&&d.peg>0){add((2-d.peg)/1.5,15);if(d.peg<1){const sp=snittOf(d,"peg");why.push(`PEG ${f(d.peg,2)}${nn(sp)?` (snitt ${f(sp,2)})`:""}`)}}
  const v=valView(d);if(nn(v.score)){add((v.score+1)/2,15);if(v.k==="pos")why.push("Undervärderad")}
  if(nn(d.dist200w)){add((40-d.dist200w)/40,20);if(d.dist200w<lim.zones.swing)why.push(`${ZNAME[zoneOf(d.dist200w)]} mot 200W`)}

  const q=qualOf(d);if(nn(q)){add(q/100,15);if(q>=75)why.push(`Kvalitet ${f(q,0)}`)}
  if(P.length<3)return d._opp=null;
  let sc=P.reduce((a,[x,w])=>a+x*w,0)/P.reduce((a,[,w])=>a+w,0)*100;

  return d._opp={s:Math.round(sc),why};
}

const BT_START=16436; // 2015-01-01 som dagnummer: backtesten på aktiesidan börjar här
function btStock(det){
  const W=det&&det.w;if(!W||!W.c||W.c.length<215)return null;
  const c=W.c,t=W.t,n=c.length,pre=[0];c.forEach(x=>pre.push(pre[pre.length-1]+x));
  let s0=200;while(s0<n-1&&t[s0]<BT_START)s0++;
  const yrs=(n-1-s0)/52,cg=x=>yrs>0.5?(Math.pow(Math.max(x,1e-9),1/yrs)-1)*100:null;
  const run=rule=>{const out=[];let pos=null,eq=1,pk=1,mdd=0,eq2=1,pk2=1,mdd2=0,inw=0;
    for(let i=s0;i<n;i++){const ma=(pre[i+1]-pre[i-199])/200,dist=(c[i]/ma-1)*100;
      if(pos&&i>s0){const r=c[i]/c[i-1]-1;eq*=1+r;eq2*=Math.max(0,1+2*r-0.05/52);inw++;pos.low=Math.min(pos.low,c[i]);pos.lev*=Math.max(0,1+2*r-0.05/52)}
      pk=Math.max(pk,eq);mdd=Math.min(mdd,eq/pk-1);pk2=Math.max(pk2,eq2);mdd2=Math.min(mdd2,eq2/pk2-1);
      if(!pos){const ent=rule==="dia"?dist<0:dist<lim.zones.swing;if(ent)pos={i,p:c[i],low:c[i],lev:1};continue}
      const ret=c[i]/pos.p-1,ex=rule==="fs"?(dist>=lim.zones.b3||ret<=-0.2):dist>=lim.zones.b4;
      if(ex){out.push({in:t[pos.i],out:t[i],r:ret,dd:pos.low/pos.p-1,lr:pos.lev-1,done:true});pos=null}}
    if(pos)out.push({in:t[pos.i],out:t[n-1],r:c[n-1]/pos.p-1,dd:pos.low/pos.p-1,lr:pos.lev-1,done:false});
    out.eq={tot:(eq-1)*100,cagr:cg(eq),mdd:mdd*100,cagr2:cg(eq2),mdd2:mdd2*100,inv:(n-1-s0)?inw/(n-1-s0)*100:0};
    return out};
  let pk=c[s0],bmdd=0;for(let i=s0;i<n;i++){pk=Math.max(pk,c[i]);bmdd=Math.min(bmdd,c[i]/pk-1)}
  return{orig:run("orig"),dia:run("dia"),fs:run("fs"),from:t[s0],bh:c[n-1]/c[s0]-1,bhc:cg(c[n-1]/c[s0]),bhdd:bmdd*100,yrs};
}

    <p><b>Tillväxtpoäng</b> (Full Throttle): tillväxt 30, kvalitet 25, värdering 25, balansräkning 20. <b>Kvalitetspoäng</b> (Low Risk, High Reward): ROE 25, PEG 25, FCF-marginal 15, låg skuld 15, vinsttillväxt 10, omsättningstillväxt 10.</p>
    <h2>Data</h2>
    <p>Yahoo Finance. Nyckeltal och analytiker uppdateras varje natt efter USA-börsens stängning, kurser ungefär var 30:e minut under börsdagen. 5-årstillväxt = årlig tillväxt mellan äldsta och senaste helår. Tillväxt 1 år = senaste 12 månader mot 12 månader innan. Börsvärde omräknat till USD. Siffror kan skilja något mot andra sajter.</p>
    <h2>Datakällor</h2>
    <div class="tw"><table class="crit"><thead><tr><th>Data</th><th>Källa</th><th>Uppdateras</th></tr></thead><tbody>
      <tr><td>Kurser (dag och vecka, 10 år), volym</td><td>Yahoo Finance via biblioteket yfinance</td><td>Var 30:e min under börsdagen, ca 15–30 min fördröjning</td></tr>
      <tr><td>Index och sektorer för kursattribution</td><td>Yahoo Finance: SPY (S&amp;P 500), ^OMX (OMX Stockholm 30), sektor-ETF:er XLK, XLV, XLY m.fl.</td><td>Varje natt</td></tr>
      <tr><td>Räntan i värderingen</td><td>Yahoo Finance: ^TNX (amerikansk 10-årsränta). Svenska och europeiska bolag: 2,5 %.</td><td>Varje natt</td></tr>
      <tr><td>Omsättning, resultat, kassaflöde, balansräkning, marginaler</td><td>Yahoo Finance (från bolagens rapporter)</td><td>Varje natt</td></tr>
      <tr><td>Analytiker: rekommendationer, riktkurser, upp- och nedgraderingar</td><td>Yahoo Finance (sammanställning av bankernas analyser)</td><td>Varje natt</td></tr>
      <tr><td>Vinstprognoser, revideringar, rapportöverraskningar</td><td>Yahoo Finance (analytikernas konsensus)</td><td>Varje natt</td></tr>
      <tr><td>Nyheter</td><td>Yahoo Finance och Google News (RSS), utgivaren anges per artikel</td><td>Varje natt</td></tr>
      <tr><td>Officiella årssiffror (USA)</td><td>SEC EDGAR: omsättning, resultat, fritt kassaflöde och aktiebaserade löner ur 10-K. Används för 5-års tillväxt och DCF</td><td>Varje natt</td></tr>
      <tr><td>Analysbrev (om påslaget)</td><td>Claude Sonnet 5.5 (Anthropic) med webbsök, källor anges i varje brev</td><td>Varje vecka, eller vid stor kursrörelse</td></tr>
      <tr><td>S&amp;P 500- och Nasdaq-100-listorna</td><td>Wikipedia</td><td>Varje natt</td></tr>
      <tr><td>200W, zoner, signaler, kursattribution, DCF, omvänd DCF, Graham, poäng</td><td>Beräknas av sidan själv, formler ovan och på varje aktie</td><td>Med datan</td></tr>
    </tbody></table></div>
    <h2>Värderingsmetoder</h2>
    <ul>
      <li><b>DCF:</b> ägarkassaflöde (fritt kassaflöde minus aktiebaserade löner) växer med prognostillväxten år 1–5, trappas ner till 2,5 % år 6–10, sedan evig tillväxt 2,5 %. Diskonteras med 10-årsränta + beta × 5 %. Nettokassa läggs till. Bear och bull ändrar tillväxt och avkastningskrav.</li>
      <li><b>Omvänd DCF:</b> vilken tillväxt år 1–5 som dagens börsvärde förutsätter. Högre än prognosen = högt ställda förväntningar.</li>
      <li><b>Graham:</b> EPS framåt × (8,5 + 2 × tillväxt) × 4,4 / obligationsränta.</li>
    </ul>
    <h2>Quant-modellen</h2>
    <p>Varje aktie rankas mot alla andra aktier på sidan i sex faktorer, på samma sätt som kvantfonder bygger faktorportföljer. Varje mått görs om till en percentil (0–100), måtten inom en faktor snittas och rankas om, så att 50 alltid är mitten av universumet.</p>
    <ul>
      <li><b>Value:</b> vinstavkastning framåt (1 / P/E framåt), fritt kassaflöde mot börsvärde (FCF-marginal / P/S), EBITDA mot EV och 1 / PEG.</li>
      <li><b>Growth:</b> omsättning 1 år, omsättning per år 3–5 år, vinst per aktie 1 år.</li>
      <li><b>Quality:</b> ROIC, bruttomarginal, rörelsemarginal, FCF-marginal och låg skuld.</li>
      <li><b>Momentum:</b> 12 månader exklusive senaste månaden (den senaste månaden tenderar att vända), 6 och 3 månader, läget i 52-veckorsspannet och kursen mot 200-dagarssnittet.</li>
      <li><b>Revisions:</b> hur vinstprognosen ändrats senaste 30 dagarna och analytikernas snittbetyg.</li>
      <li><b>Low risk:</b> låg beta, låg volatilitet och litet största fall senaste året.</li>
    </ul>
    <p><b>Quant-poäng</b> = vägt snitt (Value, Growth, Quality, Momentum ×1, Revisions och Low risk ×0,5), omrankat till 0–100. Kräver minst tre faktorer.</p>
    <h2>Värdering och sentiment</h2>
    <p><b>Värdering</b> väger ihop DCF-värdet, analytikernas riktkurs (minus 10 % för analytikernas optimism), P/E framåt mot branschmedianen, PEG, avståndet till 200W och Value-faktorn. Varje del ger −100 till +100. Över +25 = Undervärderad, under −25 = Övervärderad.</p>
    <p><b>Sentiment</b> väger ihop analytikernas betyg, prognosändringar 30 dagar, momentum 12–1 månader, kursen 3 månader, trenden (kurs mot 50- och 200-dagarssnitt) och blankningen. Över +15 = Bullish, under −15 = Bearish. Alla delar och deras vikt syns när du öppnar en rad under Mina aktier eller i Quant-profilen på aktiesidan.</p>
    <h2>Kursattribution och överreaktion</h2>
    <p>Aktiens avkastning delas upp i <b>marknad</b> (beta × index), <b>sektor</b> (sektor-ETF minus index) och <b>bolagsspecifikt</b> (resten). Den bolagsspecifika delen jämförs med aktiens normala svängningar (σ). Är fallet ovanligt stort (över 1,5 σ) men analytikernas vinstprognoser oförändrade bedöms det som en möjlig överreaktion. Sänks prognoserna samtidigt är fallet fundamentalt motiverat. Domineras rörelsen av marknad eller sektor bedöms den som makro/sektor.</p>
    <p class="muted">Diagram: TradingView Lightweight Charts. Detta är ett analysverktyg, inte investeringsrådgivning.</p>
  </div></div></section>`;
  getBT().then(()=>{const el=$("btBox");if(el){el.innerHTML=btSection();bindRows(el)}});
}

/* ============ data ============ */
async function load(){
  try{
    const r=await fetch("data/universe.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const same=U&&U.quotesAt===j.quotesAt&&U.updatedAt===j.updatedAt;
    if(same)return;
    if(U&&U.updatedAt!==j.updatedAt)detailCache={};
    U=j;rows=(j.rows||[]).map(x=>({...x}));bySym={};rows.forEach(d=>{bySym[d.ticker]=d});computeLeaders();rows.forEach(classify);
    _pm.clear();_sn.clear();computeQuant();
    const side=async n=>{try{const r=await fetch(n+"?t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
    const [fo,rp,mi,ins,bo,aij]=await Promise.all([side("focus.json"),side("positions.json"),side("mina.json"),side("insikt.json"),side("bolag.json"),side("ai.json")]);
    AIJ=aij&&aij.themes?aij:null;
    BOLAG=bo&&bo.p?bo:{};
    INSIKT=ins&&ins.visser?ins:null;
    REPO_MINE=(mi&&Array.isArray(mi.tickers)?mi.tickers:[]).map(t=>String(t).trim().toUpperCase()).filter(Boolean);
    FOCUS=fo&&fo.picks?fo:null;
    repoPos=(rp&&Array.isArray(rp.positions)?rp.positions:[]).filter(p=>p&&p.ticker&&p.qty).map((p,i)=>({...p,id:"repo"+i,src:"repo",list:p.list==="port"?"port":"swing",ticker:String(p.ticker).toUpperCase()}));
    // behåll laddad detaljdata på öppen aktie
    const h=location.hash;if(h.startsWith("#/aktie/")){const t=decodeURIComponent(h.slice(8));if(detailCache[t]&&bySym[t])bySym[t]._det=detailCache[t]}
    const ae=document.activeElement;
    if(!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))route();
    ensureFx().then(ch=>{if(ch&&/^#\/(innehav|$)|^#?$/.test(location.hash||"#/")){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))route()}});
  }catch(e){
    $("app").innerHTML=`<div class="card"><div class="bd"><h1 style="font-size:18px">Ingen data än</h1><p class="muted" style="margin-top:6px">${location.protocol==="file:"?"Öppna sidan via webbadressen, inte som fil.":"Datan skapas när uppdateringen har körts första gången (GitHub → Actions → Bygg och uppdatera → Run workflow)."}</p></div></div>`;
  }
}
load();
setInterval(()=>{if(document.visibilityState==="visible"&&!location.hash.startsWith("#/aktie/"))load()},5*60*1000);
})();
