<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aktier med 200-veckorszoner, Full Throttle och Low Risk High Reward. Kurser, analytiker och nyckeltal.">
<title>Full Throttle</title>
<style>
/* Layout: app shell — sticky header with search; pages: Start, Aktie, Screener, Strategier */
:root{
  --bg:#f3f4f6; --card:#ffffff; --sunk:#f7f8f9; --hover:#f0f2f4; --line:#e3e6e9; --line-strong:#cfd4d9;
  --ink:#1c2024; --muted:#68717a; --faint:#9aa2aa; --accent:#0b6e5d; --accent-ink:#ffffff; --accent-soft:#e3f2ee;
  --up:#0a8a4d; --down:#d1342c; --up-soft:#e6f4ec; --down-soft:#fbe9e8; --warn:#a15c00; --warn-soft:#fbf0dc;
  --z-fire:#7b3fbf; --z-vcheap:#2563c9; --z-cheap:#15803d; --z-fair:#b38600; --z-exp:#d9670b; --z-vexp:#c62828;
  --z-fire-bg:#efe6fa; --z-vcheap-bg:#e3ecfb; --z-cheap-bg:#e2f4e8; --z-fair-bg:#faf2d6; --z-exp-bg:#fcebdc; --z-vexp-bg:#fbe3e3;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1215; --card:#171b1f; --sunk:#1b2025; --hover:#20262c; --line:#262d34; --line-strong:#353e47;
  --ink:#e7eaed; --muted:#919aa3; --faint:#6b747d; --accent:#3fb59b; --accent-ink:#0b1714; --accent-soft:#163029;
  --up:#3fbf7f; --down:#ff6b61; --up-soft:#142a1e; --down-soft:#331a18; --warn:#e6a54a; --warn-soft:#33270f;
  --z-fire:#b98af0; --z-vcheap:#6fa3f5; --z-cheap:#4cc38a; --z-fair:#e3c04f; --z-exp:#f39a4f; --z-vexp:#ff7b72;
  --z-fire-bg:#2a1f3a; --z-vcheap-bg:#1a2740; --z-cheap-bg:#16301f; --z-fair-bg:#33290f; --z-exp-bg:#38230f; --z-vexp-bg:#3a1a1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1215; --card:#171b1f; --sunk:#1b2025; --hover:#20262c; --line:#262d34; --line-strong:#353e47;
  --ink:#e7eaed; --muted:#919aa3; --faint:#6b747d; --accent:#3fb59b; --accent-ink:#0b1714; --accent-soft:#163029;
  --up:#3fbf7f; --down:#ff6b61; --up-soft:#142a1e; --down-soft:#331a18; --warn:#e6a54a; --warn-soft:#33270f;
  --z-fire:#b98af0; --z-vcheap:#6fa3f5; --z-cheap:#4cc38a; --z-fair:#e3c04f; --z-exp:#f39a4f; --z-vexp:#ff7b72;
  --z-fire-bg:#2a1f3a; --z-vcheap-bg:#1a2740; --z-cheap-bg:#16301f; --z-fair-bg:#33290f; --z-exp-bg:#38230f; --z-vexp-bg:#3a1a1a;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;letter-spacing:-.005em}
p{margin:0}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.up{color:var(--up)} .down{color:var(--down)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.brand{font-weight:750;font-size:17px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand:hover{text-decoration:none}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:2px;background:var(--accent-ink);box-shadow:0 -4px 0 var(--accent-ink),0 -8px 0 var(--accent-ink);opacity:.9;width:12px}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--sunk);padding:0 12px 0 36px;font-size:14px}
.search input:focus{background:var(--card);border-color:var(--accent);outline:none}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;stroke:var(--muted)}
.dd{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .12);overflow:hidden;max-height:70vh;overflow-y:auto}
.dd a{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;color:var(--ink);border-bottom:1px solid var(--line)}
.dd a:last-child{border-bottom:0}
.dd a[aria-selected="true"],.dd a:hover{background:var(--hover);text-decoration:none}
.dd .empty{padding:12px;color:var(--muted)}
nav.main{display:flex;gap:4px}
nav.main a{color:var(--muted);padding:8px 10px;border-radius:6px;font-weight:550;white-space:nowrap}
nav.main a:hover{background:var(--hover);text-decoration:none;color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--hover)}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:8px;gap:8px 12px}
  .search{order:3;flex-basis:100%;max-width:none}
  nav.main{margin-left:auto}
  nav.main a{padding:6px 8px;font-size:13px}
}

/* cards & layout */
main{padding-block:18px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.card>.hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:15px;font-weight:650}
.card>.bd{padding:12px 16px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:980px){.g2,.g-main{grid-template-columns:minmax(0,1fr)}}
.sub{font-size:12px;color:var(--muted)}

/* controls */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted);font-weight:550}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.seg .c{opacity:.7;margin-left:4px;font-family:var(--mono);font-size:11.5px}
.btn{border:1px solid var(--line-strong);border-radius:7px;background:var(--card);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-inline:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:550}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* chips */
.z{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:5px;white-space:nowrap;font-weight:550}
.z-fire{color:var(--z-fire);background:var(--z-fire-bg)} .z-vcheap{color:var(--z-vcheap);background:var(--z-vcheap-bg)}
.z-cheap{color:var(--z-cheap);background:var(--z-cheap-bg)} .z-fair{color:var(--z-fair);background:var(--z-fair-bg)}
.z-exp{color:var(--z-exp);background:var(--z-exp-bg)} .z-vexp{color:var(--z-vexp);background:var(--z-vexp-bg)}
.z-none{color:var(--muted);background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:5px;white-space:nowrap;font-weight:550;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.pass{background:var(--up-soft);color:var(--up);border-color:transparent}
.pill.near{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.sig{font-size:10.5px;font-weight:750;padding:2px 6px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.sig.swing{background:var(--z-cheap);color:var(--card)} .sig.rea{background:var(--z-vcheap);color:var(--card)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{font-weight:600;font-size:12px;color:var(--muted);background:var(--card);position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.tk{font-family:var(--mono);font-weight:650;font-size:12.5px}
.nm{color:var(--muted);font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.co{display:flex;flex-direction:column;line-height:1.25}
.co .nm{max-width:190px}
td.bad{color:var(--down);background:var(--down-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.stick{position:sticky;left:0;z-index:1;background:var(--card)}
th.stick{z-index:3}

/* stock page */
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;padding:16px}
@media (max-width:760px){.sh{grid-template-columns:minmax(0,1fr)}}
.sh h1{font-size:22px;font-weight:700}
.sh .meta{color:var(--muted);font-size:13px;margin-top:2px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.price .p{font-size:30px;font-weight:700;letter-spacing:-.01em}
.price .ch{font-size:15px;font-weight:600}
.price .ts{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.ctool{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chartbox{position:relative;height:470px}
@media (max-width:760px){.chartbox{height:340px}}
.legend{position:absolute;left:10px;top:8px;z-index:3;font-size:12px;pointer-events:none;display:flex;flex-wrap:wrap;gap:2px 10px;max-width:calc(100% - 80px)}
.legend b{font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0 18px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--muted)}
.ladder{display:grid;gap:3px;font-size:13px}
.ladder div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-radius:6px}
.ladder div.here{box-shadow:inset 0 0 0 1.5px currentColor}
.ladder small{font-size:11.5px;opacity:.85;margin-left:6px}
.crit{width:100%;border-collapse:collapse;font-size:13px}
.crit td,.crit th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:normal;position:static}
.crit th{font-size:12px}
.crit .r{text-align:right}
.ok{color:var(--up)} .no{color:var(--down)}
.scards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:760px){.scards{grid-template-columns:minmax(0,1fr)}}
.sc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.sc b{font-size:13.5px}
.bar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--sunk)}
.bar i{display:block;height:100%}
.tgt{position:relative;height:44px;margin:6px 4px 0}
.tgt .rail{position:absolute;left:0;right:0;top:18px;height:6px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.tgt .mk{position:absolute;top:10px;width:2px;height:22px;background:var(--ink)}
.tgt .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.tgt .mk.mean{background:var(--accent)}
.tgt .mk.mean span{top:-16px;color:var(--accent);font-weight:600}
.about{font-size:13.5px;line-height:1.6;max-width:75ch}
.fbars{width:100%;height:auto;display:block}
.fbars text{font-family:var(--font);font-size:11px;fill:var(--muted)}

/* start */
.hero{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.hero h1{font-size:20px}
.radar{width:100%;height:auto;display:block;touch-action:manipulation}
.radar text{font-family:var(--font);font-size:10.5px;fill:var(--muted)}
.radar .pt{cursor:pointer}
.radar .lab{font-family:var(--mono);font-size:10.5px;fill:var(--ink);font-weight:600;pointer-events:none}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding-top:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.ev{list-style:none;margin:0;padding:0;font-size:13px}
.ev li{display:grid;grid-template-columns:52px 84px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.ev li:last-child{border-bottom:0}
.star{background:none;border:0;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;padding:2px 4px}
.star.on{color:#e0a100}
.ib{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);color:var(--muted);font:600 10px/1 Georgia,serif;font-style:italic;cursor:pointer;padding:0;margin-left:5px;vertical-align:1px;flex:none}
.ib:hover,.ib:focus-visible{border-color:var(--accent);color:var(--accent)}
#pop{position:fixed;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:12px 14px;font-size:13px;line-height:1.5}
#pop b{font-size:13.5px}
#pop p{margin:4px 0 0;color:var(--muted)}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;line-height:1.35}

/* screener */
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.critbox{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.critbox summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.critbox summary::-webkit-details-marker{display:none}
.critbox summary::before{content:"▸";color:var(--muted)}
.critbox[open] summary::before{content:"▾"}
.cgrid{display:flex;flex-wrap:wrap;gap:8px 18px;padding-top:10px}
.cf{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.cf input{width:60px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:5px;background:var(--card);font-family:var(--mono);font-size:12.5px;text-align:right}
.cf .k{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.cf.changed input{border-color:var(--accent)}
.prose{max-width:80ch;display:grid;gap:12px;font-size:14px}
.prose h2{font-size:16px;margin-top:8px}
.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.foot{padding-block:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:24px}
.skel{color:var(--muted);padding:40px 0;text-align:center}
/* innehav */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tiles>div{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.tiles b{font-size:19px;font-weight:650}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.hblk{display:grid;gap:10px;align-content:start}
.hblk h3{font-size:14px}
.bw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.bw h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.pl li:last-child{border-bottom:0}
.hform{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input{height:36px;border:1px solid var(--line-strong);border-radius:7px;background:var(--card);padding:0 10px;font-size:14px;color:var(--ink);font-family:var(--font);width:100%}
.fld input:focus{border-color:var(--accent);outline:none}
.fld .dd{top:62px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{border-color:var(--down);color:var(--down)}
/* analys */
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:3px 9px;border-radius:5px}
.v-over{background:var(--z-vcheap-bg);color:var(--z-vcheap)} .v-fund{background:var(--down-soft);color:var(--down)}
.v-fundup{background:var(--up-soft);color:var(--up)} .v-macro{background:var(--z-fair-bg);color:var(--z-fair)}
.v-hot{background:var(--z-exp-bg);color:var(--z-exp)} .v-none,.v-mix{background:var(--sunk);color:var(--muted)}
.sum{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sum li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:13.5px;line-height:1.5;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sum li:last-child{border-bottom:0;padding-bottom:0}
.sum li>span:first-child{color:var(--muted);font-size:12.5px;padding-top:1px}
@media (max-width:560px){.sum li{grid-template-columns:minmax(0,1fr);gap:2px}}
.asec{margin-top:22px}
.asec>h3{font-size:14.5px;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.attr td,.attr th{padding:7px 8px;font-size:12.5px;white-space:nowrap}
.contrib{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:90px}
.ff{width:100%;height:auto;display:block}
.ff text{font-family:var(--font);font-size:11.5px;fill:var(--muted)}
.ff .lbl{fill:var(--ink);font-size:12px}
.note{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--sunk)}
.note h4{margin:0 0 6px;font-size:15px}
.note p{font-size:13.5px;line-height:1.6;margin:6px 0 0}
.note ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55}
.news{list-style:none;margin:0;padding:0}
.news li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.news li:last-child{border-bottom:0}
.news .m{font-size:12px;color:var(--muted);margin-top:2px}
.src{font-size:12.5px;color:var(--muted);line-height:1.6}
.src b{color:var(--ink);font-weight:600}
</style>

/* ============ ordlista för info-knappar ============ */
const GL={
  price:["Kurs","Senaste betalkurs i aktiens handelsvaluta. Uppdateras ungefär var 30:e minut under börsdagen, med 15–30 minuters fördröjning."],

  ma200w:["200-veckorssnitt (200W)","Genomsnittlig stängningskurs de senaste 200 veckorna, knappt fyra år. Visar aktiens långsiktiga trend. Kvalitetsbolag har historiskt sällan handlats långt under sitt 200W-snitt."],

  status:["Status","Klarar = uppfyller alla krav i vald strategi. Nära = missar exakt ett krav. Utanför = missar fler. Utesluten sektor = finans, råvaror, energi, kraftbolag och fastigheter ingår inte."],

  roic:["ROIC, avkastning på investerat kapital","Rörelseresultat efter skatt delat med skuld plus eget kapital minus kassa. Det bästa måttet på om bolaget skapar värde. Högre än avkastningskravet (ofta 8–10 %) betyder att varje investerad krona är värd mer än en krona."],
  grossMargin:["Bruttomarginal","Andel av omsättningen kvar efter direkta kostnader för varan eller tjänsten. Hög bruttomarginal tyder på prissättningsmakt. Mjukvara ofta 70–90 %, hårdvara 20–40 %."],
  opMargin:["Rörelsemarginal","Rörelseresultat delat med omsättning. Vad som blir kvar efter alla rörelsekostnader."],

  fcfMargin:["FCF-marginal","Fritt kassaflöde delat med omsättning. Hur mycket riktiga pengar bolaget genererar per såld krona, efter investeringar. Positivt betyder att tillväxten inte behöver finansieras med lån eller nyemissioner."],
  de:["Skuld / eget kapital (D/E)","Räntebärande skuld delat med eget kapital. Under 1 betyder mer eget kapital än skuld. Höga värden ökar risken vid räntehöjningar eller svaga år. Negativt eget kapital (neg. EK) går inte att räkna."],

  pe:["P/E","Börsvärde delat med vinsten de senaste 12 månaderna. Hur många års vinst du betalar för."],

  evEbitda:["EV/EBITDA","Företagsvärde (börsvärde plus nettoskuld) delat med rörelseresultat före avskrivningar. Jämförbart mellan bolag med olika skuldsättning."],

  targetMean:["Riktkurs","Analytikernas genomsnittliga bedömning av vad aktien är värd om ungefär 12 månader. Lägst och högst visar spridningen."],
  upside:["Uppsida","Hur mycket riktkursen ligger över (+) eller under (−) dagens kurs."],
  recMean:["Analytikernas betyg","Snitt av alla rekommendationer på en skala 1–5: 1 = starkt köp, 3 = behåll, 5 = sälj."],
  analysts:["Analytikerna","Sammanställning av bankernas och analyshusens rekommendationer och riktkurser, via Yahoo Finance."],
  nextEarnings:["Nästa rapport","Datum för nästa kvartalsrapport. Kursen kan röra sig kraftigt kring rapporten, så många undviker att öppna nya swingar veckan innan."],
  attribution:["Varför aktien rört sig","Kursrörelsen delas upp i tre delar: marknaden (beta × index), sektorn (sektor-ETF minus index) och det bolagsspecifika (resten). Det bolagsspecifika är det som har med just bolaget att göra, till exempel rapporter och nyheter."],
  mktPart:["Marknad","Den del av rörelsen som förklaras av hela börsen: aktiens beta gånger indexets utveckling (S&P 500 eller OMX Stockholm 30)."],
  secPart:["Sektor","Hur mycket aktiens sektor (t.ex. tekniksektorn via ETF:en XLK) gått bättre eller sämre än index under perioden."],
  idioPart:["Bolagsspecifikt","Det som återstår när marknad och sektor räknats bort. Här syns rapporter, nyheter och förändrade förväntningar på just bolaget."],
  sigma:["Ovanlighet (σ)","Den bolagsspecifika rörelsen jämfört med aktiens normala svängningar. Över 1,5 σ är ovanligt stort, över 2 σ mycket ovanligt."],
  epsRev:["Prognosändring","Hur analytikernas vinstprognos (vinst per aktie nästa år) ändrats under samma period. Om kursen faller kraftigt men prognosen står still är det ett tecken på överreaktion."],
  verdicts:["Bedömning","Möjlig överreaktion: ovanligt bolagsspecifikt fall utan sänkta prognoser. Fundamentalt motiverat: prognoserna sänks samtidigt. Makro/sektor: rörelsen förklaras mest av marknad eller sektor och brukar gå över. Uppgång utan stöd: kursen har stigit utan att prognoserna höjts."],
  signalbild:["Signalbild","Sammanvägning av värdering (DCF), kvalitet (ROIC mot avkastningskrav), prognostrend, 200W-zon och analytikernas uppsida. Inget köp- eller säljråd."],
  valuation:["Värdering och intrinsic value","Olika sätt att räkna ut vad aktien är värd, jämfört med dagens kurs (streckad linje). Ligger kursen under de flesta intervallen är aktien billig enligt metoderna."],
  dcf:["DCF","Diskonterat kassaflöde. Bolagets framtida fria kassaflöden (minus aktiebaserade löner) räknas om till vad de är värda idag med ett avkastningskrav. Bear = försiktigt antagande, bull = optimistiskt."],
  reverseDcf:["Omvänd DCF","Räknar baklänges: vilken årlig tillväxt år 1–5 krävs för att dagens kurs ska vara rimlig? Är den högre än analytikernas prognos är förväntningarna högt ställda."],
  graham:["Graham-formeln","Benjamin Grahams enkla formel: vinst per aktie × (8,5 + 2 × tillväxt) × 4,4 / obligationsränta. Ger en grov uppskattning för lönsamma bolag."],
  wacc:["Avkastningskrav","Den årliga avkastning en investerare kräver: 10-årsränta + beta × 5 % riskpremie. Används som diskonteringsränta i DCF."],
  estimates:["Prognoser och rapporter","Analytikernas vinstprognos och hur den ändrats, antal höjningar och sänkningar, och hur bolaget levererat mot förväntningarna de senaste kvartalen."],
  surprise:["Rapportöverraskning","Hur mycket vinsten per aktie blev högre (+) eller lägre (−) än analytikerna väntat."],
  radar:["Radar","Varje prick är en aktie. Vänster–höger: hur dyr den är mot 200W-snittet. Upp–ner: poäng i vald strategi. De bästa lägena finns uppe till vänster: hög kvalitet till lågt pris."],
  watchBuy:["Bevakning: bra bolag, fel pris","Aktier som klarar en strategi men ligger över köpzonen. Kolumnen Kvar visar hur mycket kursen måste falla för att hamna i köpzonen."],
  nearLrhr:["Nära Low Risk, High Reward","Billiga aktier mot 200W som bara missar ett krav i Low Risk, High Reward."],
  events:["Händelser","Aktier som bytt 200W-zon eller fått eller tappat en signal sedan förra uppdateringen."],
  watch:["Min bevakning","Aktier du markerat med ☆. Sparas i den här webbläsaren."],
  invested:["Insats","Vad du betalade i kronor, inklusive växlingskursen när du köpte."],
  value:["Värde nu","Antal × dagens kurs × dagens valutakurs till kronor."],
  pl:["Resultat","Värde nu minus insats, i kronor och procent. Inkluderar valutaeffekten."],
  todayPl:["Idag","Hur mycket värdet ändrats sedan gårdagens stängning."],
  stopTarget:["Stop och mål","Dina egna nivåer. Stop = kurs där du tänkt sälja för att begränsa förlusten. Mål = kurs där du tänkt ta hem vinsten. Du får en markering när kursen passerat någon av dem."],
  held:["Dagar","Antal dagar sedan köpet."],
  fairValue:["Beräknat värde","DCF-värdet per aktie i basfallet, jämfört med dagens kurs."],
};
function ib(k){const g=GL[k];if(!g)return"";return `<button type="button" class="ib" data-i="${k}" aria-label="Vad är ${esc(g[0])}?">i</button>`}
function showPop(btn){
  const g=GL[btn.dataset.i];if(!g)return;const p=$("pop");
  p.innerHTML=`<b>${esc(g[0])}</b><p>${esc(g[1])}</p>`;p.hidden=false;
  const r=btn.getBoundingClientRect(),w=Math.min(320,innerWidth-24);p.style.width=w+"px";
  let x=Math.min(Math.max(12,r.left-w/2+r.width/2),innerWidth-w-12),y=r.bottom+8;
  if(y+p.offsetHeight>innerHeight-8)y=Math.max(8,r.top-p.offsetHeight-8);
  p.style.left=x+"px";p.style.top=y+"px";p.dataset.for=btn.dataset.i;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".ib");
  if(b){e.preventDefault();e.stopPropagation();const p=$("pop");if(!p.hidden&&p.dataset.for===b.dataset.i){p.hidden=true;return}showPop(b);return}
  if(!e.target.closest("#pop"))$("pop").hidden=true;
},true);
addEventListener("scroll",()=>{$("pop").hidden=true},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("pop").hidden=true});


/* ============ state ============ */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lim=store.get("ft3-lim",null); if(!lim||!lim.ftp||!lim.lrhr||!lim.zones)lim=JSON.parse(JSON.stringify(DEF));
const ui=Object.assign({strat:"ftp",filter:"all",zones:[],sort:"score",dir:-1,radar:"lrhr",tf:"D",range:"3Y",bands:true,stab:"analys",showExcl:false},store.get("ft4-ui",{}));
let watch=store.get("ft3-watch",["SOFI"]);
let U=null,rows=[],bySym={},detailCache={},chart=null,chartSym=null;
const saveUi=()=>store.set("ft4-ui",ui), saveLim=()=>store.set("ft3-lim",lim), saveWatch=()=>store.set("ft3-watch",watch);

/* ============ format ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nn=x=>x!=null&&!isNaN(x)&&isFinite(x);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function f(x,dp=1,suf=""){if(!nn(x))return"–";return x.toLocaleString("sv-SE",{minimumFractionDigits:dp,maximumFractionDigits:dp})+suf}
function px(x){if(!nn(x))return"–";if(x===0)return"0";const a=Math.abs(x);return f(x,a>=1000?0:a>=10?2:a>=1?2:4)}
const curSym=c=>!c||c==="USD"?"$":c==="SEK"?"kr":c==="EUR"?"€":c;
const money=(x,c)=>nn(x)?px(x)+" "+curSym(c):"–";
const pct=(x,dp=2)=>!nn(x)?"–":Math.abs(x)<0.5*10**-dp?f(0,dp," %"):(x>0?"+":"−")+f(Math.abs(x),dp," %");
const cls=x=>!nn(x)||x===0?"":x>0?"up":"down";
function big(x){if(!nn(x))return"–";const a=Math.abs(x);return a>=1e12?f(x/1e12,2)+" bn":a>=1e9?f(x/1e9,1)+" md":a>=1e6?f(x/1e6,0)+" mn":f(x,0)}
const mcap=b=>!nn(b)?"–":b>=1000?f(b/1000,2)+" bn $":f(b,b>=100?0:1)+" md $";
const dayToISO=d=>new Date(d*864e5).toISOString().slice(0,10);
function rel(iso){if(!iso)return"";const t=new Date(iso),m=(Date.now()-t)/6e4;if(m<2)return"nyss";if(m<60)return Math.round(m)+" min sedan";if(m<60*24)return t.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});return t.toLocaleString("sv-SE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

/* ============ strategilogik ============ */
function test(c,d,v){
  const x=d[c.f];
  if(c.nullOk&&x==null)return true;
  if(!nn(x))return false;
  if(c.de&&(d.negEquity||x<0))return false;
  if(c.pos&&x<=0)return false;
  return c.op==="≥"?x>=v:c.op===">"?x>v:c.op==="≤"?x<=v:x<v;
}
function zoneOf(dist){if(!nn(dist))return null;const z=lim.zones;return dist<0?"fire":dist<z.b1?"vcheap":dist<z.b2?"cheap":dist<z.b3?"fair":dist<z.b4?"exp":"vexp"}
function growthScore(d){let s=0;
  if(nn(d.revCagr))s+=clamp(d.revCagr/40,0,1)*15; if(nn(d.revGrowth1y))s+=clamp(d.revGrowth1y/50,0,1)*15;
  if(nn(d.roic))s+=clamp(d.roic/30,0,1)*10; if(nn(d.fcfMargin))s+=clamp(d.fcfMargin/30,0,1)*10;
  if(nn(d.grossMargin))s+=clamp((d.grossMargin-20)/60,0,1)*5; if(nn(d.peg)&&d.peg>0)s+=clamp((3-d.peg)/2.5,0,1)*15;
  if(nn(d.fwdPe)&&d.fwdPe>0)s+=clamp((80-d.fwdPe)/60,0,1)*10; if(!d.negEquity&&nn(d.de))s+=clamp((2-d.de)/2,0,1)*12;
  s+=d.shareChange==null?4:clamp((10-d.shareChange)/10,0,1)*8; return Math.round(s)}
function qualityScore(d){let s=0;
  if(nn(d.roe))s+=clamp(d.roe/40,0,1)*25; if(nn(d.peg)&&d.peg>0)s+=clamp((2-d.peg)/1.7,0,1)*25;
  if(nn(d.fcfMargin))s+=clamp(d.fcfMargin/30,0,1)*15; if(!d.negEquity&&nn(d.de))s+=clamp((1.5-d.de)/1.5,0,1)*15;
  if(nn(d.earnGrowth1y))s+=clamp(d.earnGrowth1y/30,0,1)*10; if(nn(d.revGrowth1y))s+=clamp(d.revGrowth1y/20,0,1)*10;
  return Math.round(s)}
function classify(d){
  d.res={};
  for(const k in STRATS){
    if(d.excluded){d.res[k]={miss:["sector"],status:"excl"};continue}
    const miss=STRATS[k].crit.filter(c=>!test(c,d,lim[k][c.k])).map(c=>c.k);
    d.res[k]={miss,status:!miss.length?"pass":miss.length===1?"near":"out"};
  }
  d.gScore=d.excluded?null:growthScore(d);d.qScore=d.excluded?null:qualityScore(d);
  d.z=zoneOf(d.dist200w);
  d.sig=[];
  if(nn(d.dist200w)){
    if(d.res.lrhr.status==="pass"&&d.dist200w<lim.zones.swing)d.sig.push("swing");

function searchRows(s){

  for(const d of rows){
    const t=norm(d.ticker),tb=t.replace(/\.st$/,""),n=norm(d.name+" "+(d.longName||""));

function verdict(w,rev,vol){

  if(Math.abs(w.z)<1.5){

    if(parts[0][0]!=="bolagsspecifikt")return["Makro/sektor",`Det mesta förklaras av ${parts[0][0]}. Sådana rörelser brukar inte ändra bolagets långsiktiga värde.`];

function contribBar(w){

class ZoneBands{

let pos=store.get("ft4-pos",[]);
const savePos=()=>store.set("ft4-pos",pos);
const LISTS={swing:"Swingar",port:"Portfölj"};
const fxOf=c=>c==="SEK"?1:(U&&U.fx&&U.fx[c])||null;
const kr=(x,dp=0)=>nn(x)?f(x,dp)+" kr":"–";
const krS=x=>!nn(x)?"–":Math.abs(x)<0.5?"0 kr":(x>0?"+":"−")+f(Math.abs(x),0)+" kr";
function posCalc(p){
  const d=bySym[p.ticker]||{},fx=fxOf(d.currency||p.cur),price=d.price;
  const value=nn(price)&&fx?p.qty*price*fx:null;
  const invested=nn(p.sek)?p.sek:(fx?p.qty*p.price*fx:null);
  const pl=nn(value)&&nn(invested)?value-invested:null;
  const plPct=nn(pl)&&invested?pl/invested*100:null;
  const today=nn(price)&&nn(d.prevClose)&&fx?p.qty*(price-d.prevClose)*fx:null;
  const days=p.date?Math.max(0,Math.round((Date.now()-new Date(p.date))/864e5)):null;
  const flags=[];
  if(nn(p.stop)&&nn(price)&&price<=p.stop)flags.push(["Under stop","no"]);
  if(nn(p.target)&&nn(price)&&price>=p.target)flags.push(["Mål nått","ok"]);
  if(d.z==="vexp")flags.push(["Very Expensive","no"]);
  if(d.nextEarnings){const dd=Math.round((new Date(d.nextEarnings)-Date.now())/864e5);if(dd>=0&&dd<=7)flags.push([`Rapport om ${dd} d`,"warn"])}
  return{d,fx,price,value,invested,pl,plPct,today,days,flags};
}
function posTotals(list){
  let inv=0,val=0,tod=0,n=0;
  for(const p of list){const c=posCalc(p);if(nn(c.value)&&nn(c.invested)){inv+=c.invested;val+=c.value;tod+=c.today||0;n++}}
  return{inv,val,pl:val-inv,plPct:inv?(val-inv)/inv*100:null,tod,n};
}
function tiles(t){
  return `<div class="tiles">
    <div><span class="sub">Insatt${ib("invested")}</span><b class="n">${kr(t.inv)}</b></div>
    <div><span class="sub">Värde nu${ib("value")}</span><b class="n">${kr(t.val)}</b></div>
    <div><span class="sub">Resultat${ib("pl")}</span><b class="n ${cls(t.pl)}">${krS(t.pl)}</b><span class="n small ${cls(t.plPct)}">${pct(t.plPct,1)}</span></div>
    <div><span class="sub">Idag${ib("todayPl")}</span><b class="n ${cls(t.tod)}">${krS(t.tod)}</b></div>
  </div>`;
}
function bestWorst(list){
  const c=list.map(p=>({p,c:posCalc(p)})).filter(x=>nn(x.c.plPct)).sort((a,b)=>b.c.plPct-a.c.plPct);
  if(!c.length)return"";
  const row=x=>`<li data-go="${esc(x.p.ticker)}" style="cursor:pointer"><span>${co(x.c.d.ticker?x.c.d:{ticker:x.p.ticker,name:""})}</span><span class="n ${cls(x.c.plPct)}" style="text-align:right">${pct(x.c.plPct,1)}<br><span class="small">${krS(x.c.pl)}</span></span></li>`;
  const best=c.slice(0,3),worst=c.slice(-3).reverse().filter(x=>!best.includes(x));
  return `<div class="bw"><div><h3>Bäst</h3><ul class="pl">${best.map(row).join("")}</ul></div>${worst.length?`<div><h3>Sämst</h3><ul class="pl">${worst.map(row).join("")}</ul></div>`:""}</div>`;
}

  // formulär
  const tk=$("h-tk"),dd2=$("h-dd"),pr=$("h-price"),qt=$("h-qty"),sk=$("h-sek"),msg=$("h-msg");
  const val=el=>{const v=parseFloat(String(el.value).replace(/\s/g,"").replace(",","."));return isNaN(v)?null:v};
  const cur=()=>{const d=bySym[tk.value.trim().toUpperCase()];return d?d.currency:null};
  const recalc=src=>{const p=val(pr),fx=fxOf(cur());if(!p||!fx)return;if(src==="qty"&&val(qt)!=null)sk.value=Math.round(val(qt)*p*fx);if(src==="sek"&&val(sk)!=null)qt.value=String(+(val(sk)/(p*fx)).toFixed(4)).replace(".",",")};
  qt.addEventListener("input",()=>recalc("qty"));sk.addEventListener("input",()=>recalc("sek"));pr.addEventListener("input",()=>{if(val(qt)!=null)recalc("qty")});
  tk.addEventListener("input",()=>{const items=searchRows(tk.value).slice(0,6);dd2.hidden=!items.length;dd2.innerHTML=items.map(d=>`<a href="#" data-pick="${esc(d.ticker)}"><span class="tk">${esc(d.ticker)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</span><span class="n">${money(d.price,d.currency)}</span><span></span></a>`).join("")});
  dd2.addEventListener("click",e=>{const a=e.target.closest("[data-pick]");if(!a)return;e.preventDefault();const d=bySym[a.dataset.pick];tk.value=d.ticker;dd2.hidden=true;$("h-cur").textContent=d.currency||"";if(!val(pr))pr.value=String(d.price).replace(".",",");recalc(val(qt)!=null?"qty":"sek")});
  tk.addEventListener("blur",()=>setTimeout(()=>dd2.hidden=true,200));
  if($("h-cancel"))$("h-cancel").addEventListener("click",()=>{hForm=null;location.hash="#/innehav/"+L;route()});
  $("hform").addEventListener("submit",e=>{
    e.preventDefault();
    const t=tk.value.trim().toUpperCase(),d=bySym[t];
    if(!d){msg.innerHTML=`<span class="no">Hittar inte ${esc(t)}. Välj en aktie i listan.</span>`;return}
    const p=val(pr),fx=fxOf(d.currency);let q=val(qt),s=val(sk);
    if(!p||p<=0){msg.innerHTML=`<span class="no">Ange köpkursen.</span>`;return}
    if(q==null&&s!=null&&fx)q=s/(p*fx);
    if(s==null&&q!=null&&fx)s=q*p*fx;
    if(!q||q<=0){msg.innerHTML=`<span class="no">Ange antal eller belopp i kronor.</span>`;return}
    const rec={id:F.id||Date.now().toString(36),list:L,ticker:t,cur:d.currency,price:p,qty:+q.toFixed(6),sek:s!=null?Math.round(s):null,date:$("h-date").value||null,stop:val($("h-stop")),target:val($("h-target"))};
    if(F.id)pos=pos.map(x=>x.id===F.id?rec:x);else pos.push(rec);
    savePos();hForm=null;
    if(location.hash!=="#/innehav/"+L)location.hash="#/innehav/"+L;else route();
  });
  // tabell
  bindRows($("app").querySelector("tbody")||document.createElement("div"));
  $("app").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const p=pos.find(x=>x.id===b.dataset.edit);hForm={...p};route();scrollTo({top:0,behavior:"smooth"})}));
  $("app").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();if(b.dataset.armed){pos=pos.filter(x=>x.id!==b.dataset.del);savePos();route()}else{b.dataset.armed="1";b.textContent="Bekräfta";b.classList.add("danger");setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Ta bort";b.classList.remove("danger")}},4000)}}));
  $("h-export").addEventListener("click",()=>{const io=$("h-io");io.hidden=!io.hidden;if(io.hidden)return;
    io.innerHTML=`<p class="small" style="margin-bottom:6px">Kopiera texten och klistra in den på den andra enheten (Mina innehav → Flytta till annan enhet → Importera).</p>
      <textarea id="h-json" rows="4" style="width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);border-radius:6px;padding:8px;background:var(--sunk)">${esc(JSON.stringify(pos))}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" id="h-copy">Kopiera</button><button class="btn sm" id="h-import">Importera texten ovan</button><span class="small" id="h-iomsg"></span></div>`;
    $("h-copy").addEventListener("click",()=>{const ta=$("h-json");navigator.clipboard.writeText(ta.value).then(()=>{$("h-iomsg").textContent="Kopierat."}).catch(()=>{ta.select();$("h-iomsg").textContent="Markerat, tryck Ctrl+C."})});
    $("h-import").addEventListener("click",()=>{try{const a=JSON.parse($("h-json").value);if(!Array.isArray(a))throw 0;const ids=new Set(pos.map(p=>p.id));a.forEach(p=>{if(p&&p.ticker&&p.qty&&!ids.has(p.id))pos.push(p)});savePos();route()}catch(e){$("h-iomsg").innerHTML='<span class="no">Texten gick inte att läsa.</span>'}});
  });
}

  $("app").innerHTML=`<section class="card"><div class="bd"><div class="prose">

    </tbody></table></div>
    <h2>200-veckorszoner</h2>
    <p>Samma logik som din indikator Universal Value Zones. Kursen jämförs med 200-veckors glidande medelvärde. På dagsdiagrammet räknas snittet som 199 hela veckor plus dagens kurs, precis som <span class="n">request.security</span> i TradingView.</p>
    <p style="display:flex;flex-wrap:wrap;gap:6px"><span class="z z-fire">Fire Sale: under 200W</span><span class="z z-vcheap">Very Cheap: 0–10 %</span><span class="z z-cheap">Cheap: 10–20 %</span><span class="z z-fair">Fair Value: 20–30 %</span><span class="z z-exp">Expensive: 30–40 %</span><span class="z z-vexp">Very Expensive: över 40 %</span></p>
    <h2>Kombinerade signaler</h2>
    <ul><li><span class="sig swing">SWING</span> Klarar Low Risk, High Reward och ligger under Cheap.</li><li><span class="sig rea">REA</span> Klarar Full Throttle+ och ligger under Fair Value.</li></ul>
    <p>Nya signaler skickas som mejl via en issue i GitHub-repot.</p>
    <h2>Poäng</h2>
    <p><b>Tillväxtpoäng</b> (Full Throttle): tillväxt 30, kvalitet 25, värdering 25, balansräkning 20. <b>Kvalitetspoäng</b> (Low Risk, High Reward): ROE 25, PEG 25, FCF-marginal 15, låg skuld 15, vinsttillväxt 10, omsättningstillväxt 10.</p>
    <h2>Data</h2>
    <p>Yahoo Finance. Nyckeltal och analytiker uppdateras varje natt efter USA-börsens stängning, kurser ungefär var 30:e minut under börsdagen. 5-årstillväxt = årlig tillväxt mellan äldsta och senaste helår. Tillväxt 1 år = senaste 12 månader mot 12 månader innan. Börsvärde omräknat till USD. Siffror kan skilja något mot andra sajter.</p>

    <div class="tw"><table class="crit"><thead><tr><th>Data</th><th>Källa</th><th>Uppdateras</th></tr></thead><tbody>

      <tr><td>Index och sektorer för kursattribution</td><td>Yahoo Finance: SPY (S&amp;P 500), ^OMX (OMX Stockholm 30), sektor-ETF:er XLK, XLV, XLY m.fl.</td><td>Varje natt</td></tr>

      <tr><td>Nyheter</td><td>Yahoo Finance nyhetsflöde, utgivaren anges per artikel</td><td>Varje natt</td></tr>
      <tr><td>Analysbrev (om påslaget)</td><td>Claude Sonnet 5.5 (Anthropic) med webbsök, källor anges i varje brev</td><td>Varje vecka, eller vid stor kursrörelse</td></tr>
      <tr><td>S&amp;P 500- och Nasdaq-100-listorna</td><td>Wikipedia</td><td>Varje natt</td></tr>

    </tbody></table></div>
    <h2>Värderingsmetoder</h2>
    <ul>
      <li><b>DCF:</b> ägarkassaflöde (fritt kassaflöde minus aktiebaserade löner) växer med prognostillväxten år 1–5, trappas ner till 2,5 % år 6–10, sedan evig tillväxt 2,5 %. Diskonteras med 10-årsränta + beta × 5 %. Nettokassa läggs till. Bear och bull ändrar tillväxt och avkastningskrav.</li>
      <li><b>Omvänd DCF:</b> vilken tillväxt år 1–5 som dagens börsvärde förutsätter. Högre än prognosen = högt ställda förväntningar.</li>
      <li><b>Graham:</b> EPS framåt × (8,5 + 2 × tillväxt) × 4,4 / obligationsränta.</li>
    </ul>
    <h2>Kursattribution och överreaktion</h2>
    <p>Aktiens avkastning delas upp i <b>marknad</b> (beta × index), <b>sektor</b> (sektor-ETF minus index) och <b>bolagsspecifikt</b> (resten). Den bolagsspecifika delen jämförs med aktiens normala svängningar (σ). Är fallet ovanligt stort (över 1,5 σ) men analytikernas vinstprognoser oförändrade bedöms det som en möjlig överreaktion. Sänks prognoserna samtidigt är fallet fundamentalt motiverat. Domineras rörelsen av marknad eller sektor bedöms den som makro/sektor.</p>

/* ============ data ============ */
async function load(){
  try{
    const r=await fetch("data/universe.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const same=U&&U.quotesAt===j.quotesAt&&U.updatedAt===j.updatedAt;
    if(same)return;
    if(U&&U.updatedAt!==j.updatedAt)detailCache={};
    U=j;rows=(j.rows||[]).map(x=>({...x}));bySym={};rows.forEach(d=>{bySym[d.ticker]=d;classify(d)});
    // behåll laddad detaljdata på öppen aktie
    const h=location.hash;if(h.startsWith("#/aktie/")){const t=decodeURIComponent(h.slice(8));if(detailCache[t]&&bySym[t])bySym[t]._det=detailCache[t]}
    if(!same&&document.activeElement!==$("q")&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#hform")))route();
  }catch(e){
    $("app").innerHTML=`<div class="card"><div class="bd"><h1 style="font-size:18px">Ingen data än</h1><p class="muted" style="margin-top:6px">${location.protocol==="file:"?"Öppna sidan via webbadressen, inte som fil.":"Datan skapas när uppdateringen har körts första gången (GitHub → Actions → Bygg och uppdatera → Run workflow)."}</p></div></div>`;
  }
}
load();
setInterval(()=>{if(document.visibilityState==="visible"&&!location.hash.startsWith("#/aktie/"))load()},5*60*1000);
})();
