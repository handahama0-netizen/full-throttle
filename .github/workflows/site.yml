name: Bygg och uppdatera

on:
  schedule:
    - cron: "15 22 * * 1-5"
    - cron: "*/30 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = allt, quotes = bara kurser, site = bara sidan"
        default: full
        type: choice
        options: [full, quotes, site]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Hitta projektmappen
        id: src
        run: |
          f=$(git ls-files | grep -E '(^|/)scripts/build\.py$' | head -1)
          if [ -z "$f" ]; then echo "Hittar inte scripts/build.py i repot"; exit 1; fi
          echo "dir=$(dirname "$(dirname "$f")")" >> "$GITHUB_OUTPUT"

      - name: Välj läge
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "push" ]; then m="site"
          elif [ "${{ github.event.schedule }}" = "15 22 * * 1-5" ]; then m="full"
          else m="quotes"; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Hämta förra versionen av sidan
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera
        run: pip install -r "${{ steps.src.outputs.dir }}/requirements.txt"

      - name: Bygg
        run: python "${{ steps.src.outputs.dir }}/scripts/build.py" --mode "${{ steps.mode.outputs.mode }}" --prev _prev --out _site

      - name: Mejllarm vid nya signaler
        if: hashFiles('alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Nya signaler $(date -u +%Y-%m-%d)" --body-file alerts.md

      - name: Publicera
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Uppdatering
