<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teckna elavtal – Bixia PoC</title>
<meta name="description" content="Klickbar Proof of Concept för Bixias framtida digitala teckningsresa. Demonstration – inget riktigt avtal tecknas.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DESIGNTOKENS
   Närliggande ersättare för Bixias grafiska profil. Byt mot exakta
   färgkoder och typsnitt från Bixias varumärkesmanual före användartest.
   ===================================================================== */
:root {
  --bx-orange: #F47B20;       /* varumärkesorange – ytor, ikoner, dekor */
  --bx-orange-600: #E0620F;   /* ramar, fokus, indikatorer (≥3:1 mot vitt) */
  --bx-orange-700: #CC4E06;   /* knappar med vit text (4,5:1) */
  --bx-orange-800: #A8430A;   /* länktext, hover */
  --bx-peach-50: #FFF6EE;
  --bx-peach-100: #FDEBDC;
  --bx-peach-200: #F9D6BA;
  --bx-sand: #FBF6EF;
  --bx-sand-200: #F3EADF;
  --bx-white: #FFFFFF;
  --bx-ink: #231C19;
  --bx-ink-2: #5E534D;
  --bx-ink-3: #8A7E76;
  --bx-line: #E8DDD1;
  --bx-line-2: #D8CBBE;
  --bx-green: #2F7A4D;
  --bx-green-50: #EAF4EE;
  --bx-blue-50: #EEF3F8;
  --bx-red: #B3261E;

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --shadow-sm: 0 1px 2px rgba(35, 28, 25, .06), 0 1px 1px rgba(35, 28, 25, .04);
  --shadow: 0 6px 24px rgba(35, 28, 25, .08), 0 1px 3px rgba(35, 28, 25, .06);
  --shadow-lg: 0 24px 60px rgba(35, 28, 25, .18);

  --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --demo-ink: #1A1513;
  --demo-ink-2: #2C2421;
  --demo-text: #F3EBE4;
  --demo-muted: #B9ACA3;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  color: var(--bx-ink);
  background: var(--bx-sand);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; }
a { color: var(--bx-orange-800); }
:focus-visible { outline: 3px solid var(--bx-orange-600); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 18px; height: 18px; }
.ico-lg { width: 32px; height: 32px; }

/* =====================================================================
   DEMOVERKTYG (ligger utanför Bixia-designen)
   ===================================================================== */
.demobar {
  background: var(--demo-ink);
  color: var(--demo-text);
  font-size: 14px;
  position: relative;
  z-index: 60;
}
.demobar-in { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.demobar .tag { background: #FFD9BF; color: #5A2406; font-weight: 700; font-size: 12px; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.demobar .title { font-weight: 600; white-space: nowrap; }
.demobar .spacer { flex: 1; }
.demobar .seg { display: inline-flex; background: var(--demo-ink-2); border-radius: 8px; padding: 2px; }
.demobar .seg button, .demobar .dbtn, .demobar summary {
  background: transparent; border: 0; color: var(--demo-text); padding: 6px 10px; border-radius: 6px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.demobar .seg button[aria-pressed="true"] { background: #4A3E38; font-weight: 700; }
.demobar .dbtn:hover, .demobar summary:hover, .demobar .seg button:hover { background: #3A302C; }
.demobar .dbtn[aria-pressed="true"] { background: #4A3E38; font-weight: 700; }
.demobar details { position: relative; }
.demobar summary { list-style: none; cursor: pointer; }
.demobar summary::-webkit-details-marker { display: none; }
.demobar .menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 300px; background: #FFFFFF; color: var(--bx-ink);
  border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 70;
}
.demobar .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
.demobar .menu button:hover { background: var(--bx-peach-50); }
.demobar .menu small { display: block; color: var(--bx-ink-2); font-size: 13px; }
.demobar .menu .mh { padding: 8px 12px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bx-ink-3); }
.demobar-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.demobar-toggle { display: none !important; }
@media (max-width: 760px) {
  .demobar-toggle { display: inline-flex !important; margin-left: auto; }
  .demobar .spacer { display: none; }
  .demobar-tools { display: none; width: 100%; }
  .demobar.is-open .demobar-tools { display: flex; }
  .demobar .title { display: none; }
  .demobar .seg-wrap { display: none; }
  .demobar .menu { right: auto; left: 0; min-width: 260px; }
}
.test-ribbon { display: none; }
body.testlage .demobar { display: none; }
body.testlage .test-ribbon {
  display: block; position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 80; background: var(--demo-ink); color: var(--demo-text);
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 0 0 8px 8px; opacity: .8; pointer-events: none; white-space: nowrap;
}

/* Scen: dator- eller mobilram */
.stage { position: relative; }
.device { container: app / inline-size; position: relative; background: var(--bx-sand); min-height: 100vh; }
.scroller { min-height: 100vh; }
.stage.is-mobile {
  background: #2A2320 radial-gradient(1200px 600px at 50% -10%, #4A3A32 0%, #2A2320 60%);
  min-height: calc(100vh - 44px);
  display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 28px 16px 40px; flex-wrap: wrap;
}
.stage.is-mobile .device {
  width: 390px; height: min(844px, calc(100vh - 110px)); min-height: 560px;
  border-radius: 46px; border: 11px solid #0F0C0B; box-shadow: 0 0 0 2px #3B312C, var(--shadow-lg);
  overflow: hidden; transform: translateZ(0); flex: none; display: flex; flex-direction: column;
}
.stage.is-mobile .scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.stage.is-mobile .scroller::-webkit-scrollbar { display: none; }
.stage.is-mobile .device::before {
  content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #0F0C0B; border-radius: 20px; z-index: 90; pointer-events: none;
}
.stage.is-mobile .device-statusbar { display: flex; }
.device-statusbar { display: none; height: 46px; flex: none; align-items: center; justify-content: space-between; padding: 6px 30px 0; font-size: 15px; font-weight: 700; background: var(--bx-white); }
.device-statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
.device-statusbar .sb-icons span { display: block; background: var(--bx-ink); border-radius: 2px; }

/* UX-anteckningar */
.notes {
  display: none; width: 340px; max-width: 100%; background: #FFFDFB; color: var(--bx-ink); border-radius: 16px; box-shadow: var(--shadow-lg);
  padding: 18px 18px 14px; font-size: 15px; line-height: 1.45;
}
.notes.is-on { display: block; }
.stage:not(.is-mobile) .notes { position: fixed; left: 16px; bottom: 16px; z-index: 55; max-height: 60vh; overflow: auto; }
.stage.is-mobile .notes { position: sticky; top: 28px; }
.notes h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--bx-ink-3); margin: 0 0 4px; }
.notes h3 { font-size: 18px; margin: 0 0 12px; }
.notes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.notes li { display: grid; gap: 4px; }
.notes .src { justify-self: start; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bx-sand-200); color: var(--bx-ink); }
.notes .src[data-src="E.ON Next"] { background: #FCE4EC; color: #7A1F3D; }
.notes .src[data-src="Octopus"] { background: #EDE7F6; color: #4527A0; }
.notes .src[data-src="Vattenfall"] { background: #FFF6CC; color: #6B5400; }
.notes .src[data-src="Fortum"] { background: #E3F2EA; color: #1E5C3A; }
.notes .src[data-src="Tibber/Greenely"] { background: #E3F0FA; color: #1B4F7A; }
.notes .src[data-src="Bixia"] { background: var(--bx-peach-100); color: #7A3307; }
.notes .src[data-src="Konvertering"], .notes .src[data-src="Tillgänglighet"] { background: #ECEAE8; color: #3D3633; }
.notes .src[data-src="Att testa"] { background: #FFF0D6; color: #6E4A00; }
.notes .close { float: right; border: 0; background: none; padding: 4px; color: var(--bx-ink-2); }

/* =====================================================================
   BIXIA – WEBBPLATSENS RAM (startsida)
   ===================================================================== */
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@container app (min-width: 700px) { .wrap { padding: 0 32px; } }

.logo { display: inline-flex; align-items: baseline; text-decoration: none; color: var(--bx-orange); font-weight: 800; letter-spacing: -.045em; font-size: 34px; line-height: 1; }
.logo .dot { width: .2em; height: .2em; background: currentColor; border-radius: 50%; margin-left: .04em; display: inline-block; }
.logo-sm { font-size: 28px; }

.site-top { background: var(--bx-white); border-bottom: 1px solid var(--bx-line); position: sticky; top: 0; z-index: 30; }
.util { display: none; font-size: 14px; border-bottom: 1px solid var(--bx-line); }
.util .wrap { display: flex; gap: 20px; height: 38px; align-items: center; }
.util a { color: var(--bx-ink-2); text-decoration: none; }
.util a.is-active { color: var(--bx-ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--bx-orange); padding: 9px 0; }
.util .r { margin-left: auto; display: flex; gap: 20px; }
.shead .wrap { display: flex; align-items: center; height: 68px; gap: 28px; }
.mainnav { display: none; gap: 26px; font-weight: 600; }
.mainnav a { color: var(--bx-ink); text-decoration: none; font-size: 16px; }
.mainnav a.is-active { color: var(--bx-orange-800); }
.shead .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.login { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--bx-ink); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 15px; background: var(--bx-white); text-decoration: none; color: var(--bx-ink); }
.iconbtn { border: 0; background: none; padding: 8px; border-radius: 10px; color: var(--bx-ink); }
@container app (min-width: 960px) {
  .util { display: block; }
  .mainnav { display: flex; }
  .shead .burger { display: none; }
}

.hero { background: linear-gradient(180deg, var(--bx-peach-50) 0%, var(--bx-sand) 100%); padding: 28px 0 36px; overflow: hidden; }
.hero .grid { display: grid; gap: 28px; align-items: center; }
.eyebrow { display: inline-block; font-weight: 700; font-size: 14px; color: var(--bx-orange-800); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.hero h1 { font-size: 34px; line-height: 1.08; letter-spacing: -.02em; margin: 0 0 12px; font-weight: 800; }
.hero .lead { font-size: 19px; color: var(--bx-ink-2); margin: 0 0 16px; max-width: 34ch; }
.timebadge { display: inline-flex; align-items: center; gap: 8px; background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow-sm); }
.timebadge .ico { color: var(--bx-orange-700); }
.qlabel { font-size: 20px; font-weight: 800; margin: 26px 0 12px; }
.trust { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px 22px; grid-template-columns: 1fr 1fr; font-size: 15px; color: var(--bx-ink-2); }
.trust li { display: flex; gap: 8px; align-items: center; }
.trust .ico { color: var(--bx-green); width: 20px; height: 20px; }
@container app (max-width: 429px) { .trust { grid-template-columns: 1fr; } }
.hero-art { display: none; }
.hero-art svg { width: 100%; height: auto; }
.existing { margin-top: 18px; font-size: 15px; color: var(--bx-ink-2); }
@container app (min-width: 700px) {
  .hero { padding: 48px 0 56px; }
  .hero h1 { font-size: 48px; }
  .trust { grid-template-columns: repeat(2, auto); justify-content: start; }
}
@container app (min-width: 960px) {
  .hero .grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; }
  .hero h1 { font-size: 56px; }
  .hero-art { display: block; }
}

.section { padding: 40px 0; }
.section h2 { font-size: 28px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; }
.section .sub { color: var(--bx-ink-2); margin: 0 0 22px; }
.how { display: grid; gap: 14px; counter-reset: how; }
.how li { list-style: none; background: var(--bx-white); border-radius: var(--radius); padding: 20px 20px 20px 72px; position: relative; box-shadow: var(--shadow-sm); }
.how li::before { counter-increment: how; content: counter(how); position: absolute; left: 20px; top: 20px; width: 36px; height: 36px; border-radius: 50%; background: var(--bx-orange); color: #FFF; font-weight: 800; display: grid; place-items: center; }
.how h3 { margin: 0 0 4px; font-size: 19px; }
.how p { margin: 0; color: var(--bx-ink-2); font-size: 16px; }
.how { padding: 0; margin: 0; }
.mini-avtal { display: grid; gap: 12px; margin-top: 8px; }
.mini-avtal > div { background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: var(--radius); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; }
.mini-avtal .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.mini-avtal h3 { margin: 0 0 2px; font-size: 18px; }
.mini-avtal p { margin: 0; font-size: 15px; color: var(--bx-ink-2); }
.helpstrip { background: var(--bx-white); border-radius: var(--radius-lg); padding: 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
.helpstrip .ic { width: 52px; height: 52px; border-radius: 50%; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.helpstrip h3 { margin: 0; font-size: 19px; }
.helpstrip p { margin: 2px 0 0; color: var(--bx-ink-2); font-size: 15px; }
.helpstrip .txt { flex: 1 1 240px; }
@container app (min-width: 700px) {
  .how { grid-template-columns: repeat(3, 1fr); }
  .mini-avtal { grid-template-columns: repeat(3, 1fr); }
  .section h2 { font-size: 34px; }
}
.sfoot { background: var(--bx-ink); color: #E9DFD6; padding: 36px 0 28px; margin-top: 24px; font-size: 15px; }
.sfoot .logo { color: var(--bx-orange); }
.sfoot .cols { display: grid; gap: 22px; grid-template-columns: 1fr 1fr; margin-top: 22px; }
.sfoot h4 { margin: 0 0 8px; font-size: 15px; color: #FFF; }
.sfoot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sfoot a { color: #E9DFD6; text-decoration: none; }
.sfoot .legal { border-top: 1px solid #44392F; margin-top: 26px; padding-top: 16px; color: #B9ACA3; font-size: 13px; }
@container app (min-width: 700px) { .sfoot .cols { grid-template-columns: 1.3fr repeat(3, 1fr); } }

/* =====================================================================
   KOMPONENTER
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 26px;
  border-radius: 999px; border: 2px solid transparent; font-weight: 700; font-size: 18px; text-decoration: none; line-height: 1.1;
  transition: background-color .15s ease, border-color .15s ease, transform .1s ease; text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--bx-orange-700); color: #FFF; }
.btn-primary:hover { background: var(--bx-orange-800); }
.btn-secondary { background: var(--bx-white); color: var(--bx-ink); border-color: var(--bx-ink); }
.btn-secondary:hover { background: var(--bx-sand-200); }
.btn-outline { background: var(--bx-white); color: var(--bx-orange-800); border-color: var(--bx-orange-600); }
.btn-outline:hover { background: var(--bx-peach-50); }
.btn-ghost { background: transparent; color: var(--bx-ink); border-color: transparent; padding: 0 14px; }
.btn-ghost:hover { background: var(--bx-sand-200); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; font-size: 16px; padding: 0 18px; }
.linkbtn { background: none; border: 0; padding: 4px 2px; color: var(--bx-orange-800); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; display: inline-flex; gap: 6px; align-items: center; }
.linkbtn:hover { color: var(--bx-ink); }

/* Stora klickbara val */
.tiles { display: grid; gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--bx-white);
  border: 2px solid var(--bx-line); border-radius: var(--radius); padding: 16px 18px; min-height: 76px;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease; box-shadow: var(--shadow-sm);
}
.tile:hover { border-color: var(--bx-orange-600); }
.tile .tile-ic { width: 48px; height: 48px; border-radius: 12px; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.tile .tile-num { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.tile .tile-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.tile .tile-label { font-weight: 700; font-size: 18px; line-height: 1.25; }
.tile .tile-sub { color: var(--bx-ink-2); font-size: 15px; line-height: 1.35; }
.tile .tile-radio { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--bx-line-2); flex: none; display: grid; place-items: center; background: #FFF; }
.tile.is-selected { border-color: var(--bx-orange-600); background: var(--bx-peach-50); box-shadow: 0 0 0 1px var(--bx-orange-600) inset, var(--shadow-sm); }
.tile.is-selected .tile-radio { border-color: var(--bx-orange-700); background: var(--bx-orange-700); }
.tile.is-selected .tile-radio::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid #FFF; border-bottom: 2.5px solid #FFF; transform: translateY(-1px) rotate(-45deg); }
.tile-cta .tile-radio { display: none; }
.tile-cta .tile-go { color: var(--bx-orange-700); }
.tile-cta:hover .tile-go { transform: translateX(3px); }
.tile-go { transition: transform .15s ease; }
@container app (min-width: 640px) {
  .tiles.cols-2 { grid-template-columns: 1fr 1fr; }
  .tiles.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .tiles.cols-3 .tile { flex-direction: column; align-items: flex-start; text-align: left; min-height: 160px; position: relative; padding: 18px; }
  .tiles.cols-3 .tile .tile-radio { position: absolute; right: 14px; top: 14px; }
}

/* Ja/Nej-val */
.choices { display: flex; gap: 10px; flex-wrap: wrap; }
.choice {
  flex: 1 1 0; min-width: 92px; min-height: 60px; border-radius: 14px; border: 2px solid var(--bx-line); background: var(--bx-white);
  font-weight: 700; font-size: 18px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm);
}
.choice:hover { border-color: var(--bx-orange-600); }
.choice.is-selected { border-color: var(--bx-orange-600); background: var(--bx-peach-50); box-shadow: 0 0 0 1px var(--bx-orange-600) inset; }
.choice.is-selected::before { content: ""; width: 10px; height: 6px; border-left: 2.5px solid var(--bx-orange-700); border-bottom: 2.5px solid var(--bx-orange-700); transform: translateY(-2px) rotate(-45deg); }

/* Fält */
.field { display: grid; gap: 6px; margin-bottom: 18px; }
.field label, .flabel { font-weight: 700; font-size: 17px; }
.field .hint { color: var(--bx-ink-2); font-size: 15px; margin: 0; }
.input {
  width: 100%; min-height: 56px; border: 2px solid var(--bx-line-2); border-radius: 12px; background: #FFF; padding: 12px 16px; font-size: 18px;
}
.input:hover { border-color: var(--bx-ink-3); }
.input:focus { outline: none; border-color: var(--bx-orange-600); box-shadow: 0 0 0 3px var(--bx-peach-200); }
.input[aria-invalid="true"] { border-color: var(--bx-red); }
.input-suffix { position: relative; }
.input-suffix .input { padding-right: 84px; }
.input-suffix span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--bx-ink-2); font-weight: 600; pointer-events: none; }
.err { color: var(--bx-red); font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; margin: 0; }
.err:empty { display: none; }
.row2 { display: grid; gap: 0 14px; }
@container app (min-width: 640px) { .row2 { grid-template-columns: 190px 1fr; } }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 2px solid var(--bx-line); border-radius: 14px; background: #FFF; cursor: pointer; }
.check input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--bx-orange-700); flex: none; }
.check span { font-size: 16px; }
.check small { display: block; color: var(--bx-ink-2); font-size: 14px; margin-top: 2px; }
.check.is-checked { border-color: var(--bx-orange-600); background: var(--bx-peach-50); }

.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bx-green-50); color: var(--bx-green); font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 999px; }
.chip.neutral { background: var(--bx-sand-200); color: var(--bx-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.info {
  display: flex; gap: 12px; align-items: flex-start; background: var(--bx-blue-50); border-radius: 14px; padding: 14px 16px; font-size: 15px; color: var(--bx-ink);
}
.info .ico { color: #2D5B86; margin-top: 1px; }
.info.warm { background: var(--bx-peach-50); }
.info.warm .ico { color: var(--bx-orange-800); }
.info p { margin: 0; }
.info strong { display: block; margin-bottom: 2px; }

.ph {
  display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--bx-ink-3); color: var(--bx-ink-2); background: repeating-linear-gradient(-45deg, #FFF, #FFF 6px, var(--bx-sand) 6px, var(--bx-sand) 12px);
  border-radius: 8px; padding: 2px 8px; font-size: 14px; font-weight: 700; white-space: nowrap; line-height: 1.5;
}
.ph::before { content: "◇"; font-size: 11px; }

/* =====================================================================
   FLÖDETS RAM
   ===================================================================== */
.fhead { position: sticky; top: 0; z-index: 30; background: var(--bx-white); border-bottom: 1px solid var(--bx-line); }
.fhead-in { display: flex; align-items: center; gap: 12px; height: 60px; }
.fhead .mid { display: none; font-weight: 700; color: var(--bx-ink-2); font-size: 15px; }
.fhead .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.timeleft { display: none; align-items: center; gap: 6px; color: var(--bx-ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
.timeleft .ico { width: 18px; height: 18px; color: var(--bx-orange-700); }
.helpbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--bx-line-2); background: #FFF; border-radius: 999px; padding: 7px 14px 7px 10px; font-weight: 700; font-size: 15px; }
.helpbtn:hover { border-color: var(--bx-ink); }
.helpbtn .ico { color: var(--bx-orange-700); }
@container app (min-width: 520px) { .timeleft { display: inline-flex; } }
@container app (min-width: 960px) { .fhead .mid { display: block; } .fhead-in { height: 68px; } }

.progress { padding: 0 0 12px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps li { display: grid; gap: 6px; }
.steps .bar { height: 6px; border-radius: 99px; background: var(--bx-sand-200); overflow: hidden; }
.steps .bar i { display: block; height: 100%; background: var(--bx-orange); border-radius: 99px; transition: width .35s ease; }
.steps .lbl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--bx-ink-3); font-weight: 600; }
.steps .num { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--bx-line-2); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; background: #FFF; }
.steps .is-current .lbl { color: var(--bx-ink); }
.steps .is-current .num { background: var(--bx-orange-700); border-color: var(--bx-orange-700); color: #FFF; }
.steps .is-done .num { background: var(--bx-green); border-color: var(--bx-green); color: #FFF; }
.steps .is-done .lbl { color: var(--bx-ink-2); }
.steps .lbl .t { display: none; }
.steps-mobile-title { font-size: 14px; font-weight: 700; margin: 0 0 8px; color: var(--bx-ink); }
.steps-mobile-title span { color: var(--bx-ink-3); font-weight: 600; }
@container app (min-width: 700px) {
  .steps .lbl { font-size: 14px; }
  .steps .lbl .t { display: inline; }
  .steps-mobile-title { display: none; }
}

.flow-body { display: grid; gap: 28px; padding-top: 22px; padding-bottom: 0; align-items: start; }
.flow-main { min-width: 0; max-width: 680px; width: 100%; }
.flow-side { display: none; }
@container app (min-width: 980px) {
  .flow-body { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; padding-top: 40px; }
  .flow-main { max-width: 720px; }
  .flow-side { display: block; position: sticky; top: 120px; }
  .flow-body.is-wide, .flow-body.is-center { grid-template-columns: minmax(0, 1fr); }
  .flow-body.is-wide .flow-side, .flow-body.is-center .flow-side { display: none; }
  .flow-body.is-wide .flow-main { max-width: none; }
  .flow-body.is-wide .rec, .flow-body.is-wide .view > .lead { max-width: 860px; }
  .flow-body.is-wide .msum { display: block; max-width: 860px; }
}
.flow-body.is-center .flow-main { margin: 0 auto; }

.view h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.015em; margin: 0 0 8px; font-weight: 800; }
.view h1:focus { outline: none; }
.view .lead { font-size: 18px; color: var(--bx-ink-2); margin: 0 0 22px; }
.view h2 { font-size: 21px; margin: 30px 0 12px; line-height: 1.2; }
.view h2.q { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
.view h2.q .ico { color: var(--bx-orange-700); }
.view .qsub { margin: -6px 0 12px; color: var(--bx-ink-2); font-size: 16px; }
.crumb { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--bx-ink-2); background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: 999px; padding: 4px 6px 4px 12px; margin-bottom: 14px; }
.crumb .linkbtn { font-size: 15px; }
@container app (min-width: 700px) { .view h1 { font-size: 38px; } .view .lead { font-size: 19px; } }

.actions {
  position: sticky; bottom: 0; z-index: 25; display: flex; gap: 10px; align-items: center; margin: 28px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .96); backdrop-filter: saturate(1.4) blur(8px); border-top: 1px solid var(--bx-line); box-shadow: 0 -6px 20px rgba(35, 28, 25, .06);
}
.actions .btn-primary { flex: 1; }
.actions .back { min-width: 56px; padding: 0 14px; }
.actions .back .t { display: none; }
@container app (min-width: 520px) { .actions .back .t { display: inline; } .actions .back { padding: 0 22px; } }
@container app (min-width: 700px) {
  .actions { margin: 32px 0 0; bottom: 16px; border-radius: 20px; padding: 14px 18px; border: 1px solid var(--bx-line); }
  .actions .btn-primary { flex: 0 1 auto; min-width: 260px; margin-left: auto; }
}
.after-actions { height: 32px; }

/* Uppskattningskort */
.estimate {
  margin-top: 18px; background: var(--bx-white); border-radius: var(--radius); border: 1px solid var(--bx-line); padding: 18px 20px; display: grid; gap: 4px; box-shadow: var(--shadow-sm);
  position: relative; overflow: hidden;
}
.estimate::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--bx-orange); }
.estimate .k { font-size: 14px; font-weight: 700; color: var(--bx-ink-2); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.estimate .v { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.estimate .v small { font-size: 18px; font-weight: 700; color: var(--bx-ink-2); letter-spacing: 0; }
.estimate .m { color: var(--bx-ink-2); font-size: 15px; }
.estimate .delta { display: inline-flex; align-items: center; gap: 4px; background: var(--bx-peach-100); color: #7A3307; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 2px 10px; justify-self: start; margin-top: 4px; }
.estimate.flash { animation: flash .6s ease; }
@keyframes flash { 0% { background: var(--bx-peach-100); } 100% { background: var(--bx-white); } }

/* Förbrukningssammanfattning */
.usage-card { background: var(--bx-white); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--bx-line); }
.usage-card .big { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.usage-card .big small { font-size: 20px; font-weight: 700; color: var(--bx-ink-2); letter-spacing: 0; }
.usage-card .per { color: var(--bx-ink-2); margin: 6px 0 16px; }
.stack { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--bx-sand-200); }
.stack i { display: block; height: 100%; transition: width .35s ease; }
.legend { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 15px; }
.legend li { display: flex; align-items: center; gap: 10px; }
.legend .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.legend .val { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.c-hush { background: var(--bx-orange); }
.c-varme { background: #B8532A; }
.c-elbil { background: #F5B47F; }
.c-egen { background: var(--bx-orange-700); }
.adjust { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--bx-line); }
.adjust .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.range { flex: 1 1 220px; accent-color: var(--bx-orange-700); height: 32px; }
.adjust .input-suffix { flex: 0 0 170px; }
.adjust .input { min-height: 48px; font-size: 17px; }
.tag-adj { display: inline-flex; gap: 6px; align-items: center; background: var(--bx-sand-200); border-radius: 999px; font-size: 13px; font-weight: 700; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }

/* Avtal */
.rec {
  background: linear-gradient(135deg, var(--bx-peach-100), var(--bx-peach-50)); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 22px; border: 1px solid var(--bx-peach-200);
}
.rec .k { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: #7A3307; display: flex; gap: 6px; align-items: center; }
.rec h2 { margin: 6px 0 10px; font-size: 24px; }
.rec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rec li { display: flex; gap: 10px; align-items: flex-start; }
.rec li .ico { color: var(--bx-green); margin-top: 1px; width: 22px; height: 22px; }
.rec .note { margin: 12px 0 0; font-size: 15px; color: var(--bx-ink-2); }
.cards { display: grid; gap: 16px; }
.card {
  background: var(--bx-white); border-radius: var(--radius-lg); border: 2px solid var(--bx-line); padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px; position: relative; box-shadow: var(--shadow-sm);
}
.card.is-rec { border-color: var(--bx-orange-600); box-shadow: var(--shadow); }
.card.is-chosen { border-color: var(--bx-green); }
.card .badge { position: absolute; top: -13px; left: 18px; background: var(--bx-orange-700); color: #FFF; font-weight: 800; font-size: 13px; letter-spacing: .03em; border-radius: 999px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 4px; }
.card .badge.chosen { background: var(--bx-green); }
.card .top { display: flex; gap: 12px; align-items: center; }
.card .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.card h3 { margin: 0; font-size: 22px; line-height: 1.15; }
.card .desc { margin: 0; color: var(--bx-ink); font-size: 16px; }
.card .fits { margin: 0; font-size: 15px; color: var(--bx-ink-2); background: var(--bx-sand); border-radius: 12px; padding: 10px 12px; }
.card .fits b { color: var(--bx-ink); }
.cost { border-top: 1px solid var(--bx-line); border-bottom: 1px solid var(--bx-line); padding: 12px 0; display: grid; gap: 2px; }
.cost .k { font-size: 14px; color: var(--bx-ink-2); font-weight: 600; }
.cost .v { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.cost .m { font-size: 13px; color: var(--bx-ink-3); }
.terms { margin: 0; display: grid; gap: 0; font-size: 15px; }
.terms > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--bx-line); align-items: baseline; }
.terms > div:last-child { border-bottom: 0; }
.terms dt { color: var(--bx-ink-2); flex: none; }
.terms dd { margin: 0; text-align: right; font-weight: 700; }
.card .req { font-size: 14px; color: var(--bx-ink-2); display: flex; gap: 8px; margin: 0; }
.card .req .ico { width: 18px; height: 18px; color: var(--bx-ink-3); margin-top: 2px; }
.card .btn { margin-top: auto; }
@container app (min-width: 1000px) {
  .cards.three { grid-template-columns: repeat(3, 1fr); align-items: stretch; }
}
.verify-note { margin-top: 18px; font-size: 14px; color: var(--bx-ink-2); display: flex; gap: 8px; align-items: flex-start; }
.verify-note .ico { width: 18px; height: 18px; margin-top: 2px; }

/* Sammanfattning / granska */
.sum { background: var(--bx-white); border-radius: var(--radius-lg); border: 1px solid var(--bx-line); box-shadow: var(--shadow-sm); overflow: hidden; }
.sum-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px; background: var(--bx-peach-50); border-bottom: 1px solid var(--bx-line); }
.sum-h .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--bx-white); color: var(--bx-orange-800); display: grid; place-items: center; }
.sum-h h2 { margin: 0; font-size: 20px; }
.sum-h p { margin: 0; color: var(--bx-ink-2); font-size: 15px; }
.sum dl { margin: 0; }
.sum .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 20px; border-bottom: 1px solid var(--bx-line); align-items: center; }
.sum .r:last-child { border-bottom: 0; }
.sum dt { color: var(--bx-ink-2); font-size: 14px; font-weight: 600; grid-column: 1; }
.sum dd { margin: 0; font-weight: 700; font-size: 17px; grid-column: 1; }
.sum dd .s { display: block; font-weight: 500; color: var(--bx-ink-2); font-size: 14px; }
.sum .edit { grid-column: 2; grid-row: 1 / span 2; }
.sum .r.total { background: var(--bx-sand); }
.sum .r.total dd { font-size: 20px; }

.addons-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.addons-h h2 { margin: 0; }
.addons-h p { margin: 4px 0 0; color: var(--bx-ink-2); font-size: 15px; width: 100%; }
.addons { display: grid; gap: 12px; margin-top: 14px; }
@container app (min-width: 640px) { .addons { grid-template-columns: 1fr 1fr; } }
.addon { background: var(--bx-white); border: 2px solid var(--bx-line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; align-content: start; }
.addon.is-on { border-color: var(--bx-green); background: #FBFEFC; }
.addon .top { display: flex; gap: 12px; align-items: flex-start; }
.addon .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.addon h3 { margin: 0; font-size: 18px; }
.addon p { margin: 0; font-size: 15px; color: var(--bx-ink-2); }
.addon .fit { font-size: 13px; font-weight: 700; color: #7A3307; background: var(--bx-peach-100); border-radius: 999px; padding: 2px 10px; justify-self: start; }
.addon .price { font-size: 14px; display: grid; gap: 4px; }
.addon .price div { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.addon .price span:first-child { color: var(--bx-ink-2); }
.addon .acts { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.addon .toggle { min-height: 44px; border-radius: 999px; border: 2px solid var(--bx-orange-600); background: #FFF; color: var(--bx-orange-800); font-weight: 800; font-size: 16px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; }
.addon .toggle:hover { background: var(--bx-peach-50); }
.addon.is-on .toggle { background: var(--bx-green); border-color: var(--bx-green); color: #FFF; }
.addon-foot { font-size: 14px; color: var(--bx-ink-2); margin: 10px 0 0; }

/* Steg / tidslinje */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: var(--bx-line); }
.timeline .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.timeline .dot.done { background: var(--bx-green); color: #FFF; }
.timeline h3 { margin: 6px 0 2px; font-size: 17px; }
.timeline p { margin: 0; color: var(--bx-ink-2); font-size: 15px; }
.timeline .when { font-size: 13px; font-weight: 700; color: var(--bx-orange-800); text-transform: uppercase; letter-spacing: .05em; }

.panel { background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: var(--radius); padding: 18px 20px; margin-top: 16px; }
.panel h2 { margin: 0 0 12px; font-size: 19px; display: flex; gap: 8px; align-items: center; }
.panel h2 .ico { color: var(--bx-orange-700); }
.panel ul.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 16px; }
.panel ul.ticks li { display: flex; gap: 10px; align-items: flex-start; }
.panel ul.ticks .ico { color: var(--bx-green); width: 20px; height: 20px; margin-top: 2px; }
.two { display: grid; gap: 16px; }
@container app (min-width: 760px) { .two { grid-template-columns: 1fr 1fr; } .two .panel { margin-top: 0; } }

.bankid-btn .bid { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: rgba(255, 255, 255, .18); }

/* Sidopanel */
.side-card { background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.side-card h2 { font-size: 17px; margin: 0; padding: 16px 20px; border-bottom: 1px solid var(--bx-line); display: flex; align-items: center; gap: 8px; }
.side-card ul { list-style: none; margin: 0; padding: 6px 0; }
.side-card li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 20px; font-size: 15px; }
.side-card li .ico { width: 20px; height: 20px; color: var(--bx-orange-700); margin-top: 1px; }
.side-card li b { display: block; font-size: 13px; color: var(--bx-ink-3); font-weight: 600; }
.side-card li .linkbtn { font-size: 14px; padding: 0; }
.side-card .empty { padding: 16px 20px; color: var(--bx-ink-2); font-size: 15px; margin: 0; }
.side-card .foot { padding: 14px 20px; background: var(--bx-sand); font-size: 14px; color: var(--bx-ink-2); display: flex; gap: 8px; align-items: center; }
.side-card .foot .ico { color: var(--bx-green); width: 18px; height: 18px; }
.side-help { margin-top: 14px; display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-radius: var(--radius); background: var(--bx-white); border: 1px solid var(--bx-line); }
.side-help .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--bx-peach-100); color: var(--bx-orange-800); display: grid; place-items: center; flex: none; }
.side-help p { margin: 0; font-size: 14px; color: var(--bx-ink-2); }
.side-help b { display: block; color: var(--bx-ink); font-size: 15px; }

.msum { margin: 0 0 16px; background: var(--bx-white); border: 1px solid var(--bx-line); border-radius: 14px; }
.msum summary { list-style: none; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
.msum summary::-webkit-details-marker { display: none; }
.msum summary .ico { width: 18px; height: 18px; color: var(--bx-orange-700); }
.msum summary .chev { margin-left: auto; transition: transform .2s; }
.msum[open] summary .chev { transform: rotate(180deg); }
.msum .side-card { border: 0; box-shadow: none; border-top: 1px solid var(--bx-line); border-radius: 0 0 14px 14px; }
.msum .side-card h2 { display: none; }
@container app (min-width: 980px) { .msum { display: none; } }
.msum summary .t { white-space: nowrap; }
.msum summary .kwh { margin-left: auto; font-weight: 600; color: var(--bx-ink-2); white-space: nowrap; }
.msum summary .chev { margin-left: 0; }

/* Klart */
.done-hero { text-align: center; padding: 10px 0 8px; }
.done-hero .ok { width: 76px; height: 76px; border-radius: 50%; background: var(--bx-green); color: #FFF; display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 0 0 10px var(--bx-green-50); }
.done-hero .ok .ico { width: 40px; height: 40px; stroke-width: 2.6; }
.done-hero .lead { margin-left: auto; margin-right: auto; max-width: 46ch; }

  boende: { lagenhet: 'Lägenhet', villa: 'Villa', radhus: 'Radhus' },
  storlek: { '1-2': '1–2 rum', '3': '3 rum', '4+': '4 rum eller fler', egen: 'Egen årsförbrukning' },
  uppvarmning: { el: 'Elvärme eller värmepump', annan: 'Annan uppvärmning', vetej: 'Vet inte' },
  janej: { ja: 'Ja', nej: 'Nej', osaker: 'Osäker' },
};

/* =====================================================================
   BERÄKNINGAR
   ===================================================================== */
const harHus = () => S.boende === 'villa' || S.boende === 'radhus';
const egen = () => S.storlek === 'egen';
const egenVarde = () => { const v = parseInt(String(S.egenKwh).replace(/\D/g, ''), 10); return Number.isFinite(v) ? v : 0; };
function delar() {
  if (!S.boende || !S.storlek) return null;
  if (egen()) return { hush: 0, varme: 0, elbil: 0, egen: egenVarde() };
  const hush = HUSHALL[S.boende][S.storlek];
  const varme = harHus() && S.uppvarmning === 'el' ? VARME[S.boende][S.storlek] : 0;
  const elbil = S.elbil === 'ja' ? ELBIL_KWH : 0;
  return { hush, varme, elbil, egen: 0 };
}
function kwhBas() { const d = delar(); return d ? d.hush + d.varme + d.elbil + d.egen : 0; }
function kwh() { return S.justerad ? S.justerad : kwhBas(); }
function manadskostnad(id) {
  const k = kwh(); if (!k) return null;
  const p = PRISER[id];
  if (id === 'fast') {
    if (p.elpris == null || p.manadsavgift == null) return null;
    return k / 12 * p.elpris / 100 + p.manadsavgift;
  }
  if (PRISER.spotExempel == null || p.paslag == null || p.manadsavgift == null) return null;
  return k / 12 * (PRISER.spotExempel + p.paslag) / 100 + p.manadsavgift;
}

function rekommendation() {
  const k = kwh();
  const reasons = [];
  let id;
  if (S.prio === 'fast') id = 'fast';
  else if (S.prio === 'styra') id = 'kvart';
  else if (S.prio === 'enkel') id = 'rorligt';
  else if (S.flex === 'ja') id = 'kvart';
  else if (k >= 10000 && S.uppvarmning === 'el') id = 'fast';
  else id = 'rorligt';

  if (id === 'fast') {
    reasons.push(S.prio === 'fast' ? 'Du vill veta vad elen kostar varje månad.' : 'Du använder mycket el och påverkas därför mer när elpriset svänger.');
    if (S.uppvarmning === 'el' && k >= 8000) reasons.push(`Med elvärme och cirka ${fmt(k)} kWh per år kan vintermånaderna bli dyra. Ett fast pris ger trygghet.`);
    reasons.push('Elpriset är detsamma i 12 månader, oavsett vad som händer på elmarknaden.');
  } else if (id === 'kvart') {
    if (S.flex === 'ja') reasons.push('Du kan använda mer el när priset är lägre.');
    else reasons.push('Du vill styra din elanvändning för att spara.');
    if (S.elbil === 'ja') reasons.push('Du laddar elbil hemma. Att ladda när elen är billig, ofta på natten, gör stor skillnad.');
    reasons.push('Du betalar elbörsens pris per kvart och har ingen bindningstid.');
    if (S.flex !== 'ja') reasons.push('Tips: Du sparar mest om du kan flytta en del av din elanvändning till billiga timmar.');
  } else {
    reasons.push(S.prio === 'enkel' ? 'Du vill ha ett enkelt avtal utan bindning.' : 'Du vill inte behöva styra din elanvändning efter priset.');
    reasons.push('Priset räknas som ett snitt för hela månaden, så du behöver inte hålla koll på timmar eller kvartar.');
    reasons.push('Ingen bindningstid. Du kan byta avtal när du vill.');
  }
  return { id, reasons };
}

/* =====================================================================
   VYER OCH FLÖDE
   ===================================================================== */
const STEG = ['Ditt hem', 'Välj elavtal', 'Granska och bekräfta'];
const VIEWS = [
  { id: 'start', step: 0, sec: 180 },
  { id: 'adress', step: 1, sec: 170, valid: () => vAdress() },
  { id: 'boende', step: 1, sec: 145, valid: () => S.boende ? null : { boende: 'Välj hur du bor för att fortsätta.' } },
  { id: 'storlek', step: 1, sec: 130, valid: () => vStorlek() },
  { id: 'uppvarmning', step: 1, sec: 115, when: () => harHus() && !egen(), valid: () => S.uppvarmning ? null : { uppvarmning: 'Välj ett alternativ. Är du osäker, välj Vet inte.' } },
  { id: 'anvandning', step: 1, sec: 100, valid: () => vAnvandning() },
  { id: 'forbrukning', step: 1, sec: 85 },
  { id: 'assistent', step: 2, sec: 75, valid: () => S.prio ? null : { prio: 'Välj det som är viktigast för dig, eller visa alla avtal.' } },
  { id: 'avtal', step: 2, sec: 65 },
  { id: 'granska', step: 3, sec: 45 },
  { id: 'bekrafta', step: 3, sec: 25, valid: () => vBekrafta() },
  { id: 'klart', step: 4, sec: 0 },
];
const V = Object.fromEntries(VIEWS.map(v => [v.id, v]));
const applies = v => !v.when || v.when();
const idx = id => VIEWS.findIndex(v => v.id === id);

function vAdress() {
  const e = {};
  if (String(S.postnummer).replace(/\D/g, '').length !== 5) e.postnummer = 'Ange ett postnummer med fem siffror.';
  if (String(S.adress).trim().length < 3) e.adress = 'Ange din gatuadress.';
  if (S.syfte === 'flytt' && !S.flyttdatum) e.flyttdatum = 'Välj datum för inflyttning.';
  return Object.keys(e).length ? e : null;
}
function vStorlek() {
  if (!S.storlek) return { storlek: 'Välj hur stort ditt hem är.' };
  if (egen()) { const v = egenVarde(); if (v < 300 || v > 100000) return { egenKwh: 'Ange din årsförbrukning i kWh, till exempel 4500.' }; }
  return null;
}
function vAnvandning() {
  const e = {};
  if (!S.elbil) e.elbil = 'Svara ja eller nej.';
  if (!S.flex) e.flex = 'Välj ett alternativ. Är du osäker, välj Osäker.';
  return Object.keys(e).length ? e : null;
}
function vBekrafta() {
  const e = {};
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(S.epost).trim())) e.epost = 'Ange en e-postadress, till exempel namn@exempel.se.';
  if (String(S.mobil).replace(/\D/g, '').length < 8) e.mobil = 'Ange ditt mobilnummer.';
  if (S.syfte === 'byte' && S.start === 'datum' && !S.startdatum) e.startdatum = 'Välj startdatum.';
  if (!S.villkor) e.villkor = 'Du behöver godkänna avtalsvillkoren för att kunna signera.';
  return Object.keys(e).length ? e : null;
}

function nextOf(id) { for (let i = idx(id) + 1; i < VIEWS.length; i++) if (applies(VIEWS[i])) return VIEWS[i].id; return null; }
function prevOf(id) { for (let i = idx(id) - 1; i >= 0; i--) if (applies(VIEWS[i])) return VIEWS[i].id; return null; }
function targetAfter(id) {
  if (S.returnTo && idx(S.returnTo) > idx(id)) {
    for (let i = idx(id) + 1; i < idx(S.returnTo); i++) {
      const v = VIEWS[i];
      if (applies(v) && v.valid && v.valid()) return v.id;
    }
    return S.returnTo;
  }
  return nextOf(id);
}

function go(id, opts = {}) {
  S.view = id;
  const tst = $('#toast'); if (tst) tst.style.opacity = '0';
  if (S.returnTo && (id === S.returnTo || idx(id) > idx(S.returnTo))) S.returnTo = null;
  UI.errors = {};
  save();
  render({ focus: true, top: true, ...opts });
}
function edit(id) {
  if (idx(id) < idx(S.view) && S.view !== 'klart') S.returnTo = S.view;
  go(id);
}
function forward() {
  const v = V[S.view];
  const errs = v.valid ? v.valid() : null;
  if (errs) {
    UI.errors = errs;
    render({ keepScroll: true });
    const first = $('[data-err]:not(:empty)', $('#app'));
    if (first) {
      const host = first.closest('[data-errhost]') || first;
      host.scrollIntoView({ block: 'center', behavior: 'smooth' });
      const ctrl = $('input, button.tile, button.choice', host.closest('[data-errhost]') || host.parentElement);
      if (ctrl) ctrl.focus({ preventScroll: true });
    }
    return;
  }
  if (S.view === 'bekrafta') { openBankID(); return; }
  if (S.view === 'avtal' && !S.avtal) S.avtal = rekommendation().id;
  go(targetAfter(S.view));
}
function back() { const p = prevOf(S.view); if (p) go(p); }

/* =====================================================================
   SMÅ BYGGSTENAR
   ===================================================================== */
function tiles(key, opts, cols = 1, cta = false) {
  return `<div class="tiles cols-${cols}" role="${cta ? 'group' : 'radiogroup'}" aria-labelledby="q-${key}">` + opts.map(o => {
    const sel = S[key] === o.v;
    const aria = cta ? '' : `role="radio" aria-checked="${sel}"`;
    const lead = o.num ? `<span class="tile-ic"><span class="tile-num">${o.num}</span></span>` : o.ic ? `<span class="tile-ic">${ico(o.ic)}</span>` : '';
    return `<button type="button" class="tile${sel ? ' is-selected' : ''}${cta ? ' tile-cta' : ''}" ${aria} data-set="${key}" data-value="${o.v}" id="t-${key}-${o.v}">
      ${lead}<span class="tile-text"><span class="tile-label">${o.label}</span>${o.sub ? `<span class="tile-sub">${o.sub}</span>` : ''}</span>
      ${cta ? `<span class="tile-go">${ico('arrowR')}</span>` : '<span class="tile-radio" aria-hidden="true"></span>'}
    </button>`;
  }).join('') + '</div>';
}
function choices(key, opts) {
  return `<div class="choices" role="radiogroup" aria-labelledby="q-${key}">` + opts.map(o => {
    const sel = S[key] === o.v;
    return `<button type="button" class="choice${sel ? ' is-selected' : ''}" role="radio" aria-checked="${sel}" data-set="${key}" data-value="${o.v}" id="t-${key}-${o.v}">${o.label}</button>`;
  }).join('') + '</div>';
}
const err = key => `<p class="err" data-err="${key}" role="alert">${UI.errors[key] ? ico('info', 'ico-sm') + esc(UI.errors[key]) : ''}</p>`;
const info = (title, text, warm = false, icon = 'info') => `<div class="info${warm ? ' warm' : ''}">${ico(icon)}<p>${title ? `<strong>${title}</strong>` : ''}${text}</p></div>`;

function estimateCard(extraNote = '') {
  const d = delar();
  if (!d) return `<div class="estimate" data-live="estimate" aria-live="polite" hidden></div>`;
  return `<div class="estimate${UI.flash ? ' flash' : ''}" data-live="estimate" aria-live="polite">${estimateInner(extraNote)}</div>`;
}
function estimateInner(extraNote = '') {
  const d = delar(); if (!d) return '';
  const k = kwhBas();
  if (egen()) {
    return `<span class="k">${ico('gauge', 'ico-sm')} Din årsförbrukning</span>
      <span class="v">${k ? fmt(k) : '–'} <small>kWh per år</small></span>
      <span class="m">${k ? `Cirka ${fmt(k / 12)} kWh i månaden.` : 'Fyll i din förbrukning ovan.'}</span>`;
  }
  const what = `${LBL.boende[S.boende].toLowerCase()} med ${LBL.storlek[S.storlek].replace(' eller fler', ' eller fler')}`;
  let delta = '';
  if (S.view === 'uppvarmning' && d.varme) delta = `<span class="delta">+ ${fmt(d.varme)} kWh för uppvärmning</span>`;
  if (S.view === 'anvandning' && d.elbil) delta = `<span class="delta">+ ${fmt(d.elbil)} kWh för elbil</span>`;
  return `<span class="k">${ico('bolt', 'ico-sm')} Uppskattad årsförbrukning</span>
    <span class="v">${fmt(k)} <small>kWh per år</small></span>
    ${delta}
    <span class="m">Uppskattning för ${what}. Cirka ${fmt(k / 12)} kWh i månaden. ${extraNote}</span>`;
}

R.forbrukning = () => {
  const d = delar(); const k = kwh(); const base = kwhBas();
  const max = Math.max(40000, Math.ceil(base * 1.6 / 1000) * 1000);
  const parts = d.egen ? [{ c: 'c-egen', l: 'Din angivna förbrukning', v: d.egen }] : [
    { c: 'c-hush', l: 'Hushållsel', v: d.hush },
    { c: 'c-varme', l: 'Uppvärmning', v: d.varme },

  const om = elomrade(S.postnummer);
  const facts = [
    om && `Elområde ${om}`,
    `${LBL.boende[S.boende]} · ${LBL.storlek[S.storlek]}`,
    harHus() && !egen() && S.uppvarmning && LBL.uppvarmning[S.uppvarmning] + (S.uppvarmning === 'vetej' ? ' (uppvärmning)' : ''),

    <div data-live="usage">${usageInner(parts)}</div>
    <div class="adjust">
      <label class="flabel" for="f-range" style="display:block;margin-bottom:8px">Justera förbrukningen</label>
      <div class="row">
        <input class="range" type="range" id="f-range" min="500" max="${max}" step="100" value="${k}" data-input="justerad" aria-describedby="adj-hint">
        <div class="input-suffix"><input class="input" id="f-kwh" data-input="justeradText" inputmode="numeric" value="${k}" aria-label="Årsförbrukning i kWh"><span>kWh/år</span></div>
      </div>
      <p class="hint" id="adj-hint" style="margin:8px 0 0;color:var(--bx-ink-2);font-size:15px">Du hittar din faktiska förbrukning på fakturan från ditt elnätsbolag.</p>
      <div data-live="reset">${S.justerad ? `<button class="linkbtn" type="button" data-act="resetKwh" style="margin-top:8px">Återställ till vår uppskattning (${fmt(base)} kWh)</button>` : ''}</div>
    </div>
  </div>
  <div class="chips" style="margin-top:16px">${facts.map(f => `<span class="chip neutral">${esc(f)}</span>`).join('')}<button class="linkbtn" type="button" data-edit="boende" style="font-size:15px">Ändra svar</button></div>
  <div style="margin-top:16px;display:grid;gap:12px">
    ${!egen() ? info('Uppskattning med schablonvärden', 'Den bygger på typiska värden för liknande hem och är inte exakt. Du kan alltid ändra den.') : ''}
    ${S.uppvarmning === 'vetej' ? info('Värms huset med el?', 'Då kan förbrukningen vara betydligt högre, ofta 10 000–20 000 kWh per år. Justera gärna.', true, 'heat') : ''}
  </div>`;
};
function usageInner(parts) {
  const d = delar(); const k = kwh();
  parts = parts || (d.egen ? [{ c: 'c-egen', l: 'Din angivna förbrukning', v: d.egen }] : [
    { c: 'c-hush', l: 'Hushållsel', v: d.hush }, { c: 'c-varme', l: 'Uppvärmning', v: d.varme }, { c: 'c-elbil', l: 'Elbil', v: d.elbil },
  ].filter(p => p.v > 0));
  const sum = parts.reduce((a, p) => a + p.v, 0) || 1;
  return `<div class="big">${fmt(k)} <small>kWh per år</small>${S.justerad ? '<span class="tag-adj">Justerad av dig</span>' : ''}</div>
    <p class="per">Cirka ${fmt(k / 12)} kWh i månaden</p>
    ${S.justerad ? '' : `<div class="stack" aria-hidden="true">${parts.map(p => `<i class="${p.c}" style="width:${p.v / sum * 100}%"></i>`).join('')}</div>
    <ul class="legend">${parts.map(p => `<li><span class="sw ${p.c}"></span>${p.l}<span class="val">${fmt(p.v)} kWh</span></li>`).join('')}</ul>`}`;
}

function timeLeft(id) {
  const s = V[id].sec;
  if (!s) return '';
  const m = Math.ceil(s / 60);
  return s < 60 ? 'Under 1 min kvar' : `Cirka ${m} min kvar`;
}
function progressHTML(id) {
  const v = V[id]; const step = v.step;
  const inStep = VIEWS.filter(x => x.step === step && applies(x));
  const pos = inStep.findIndex(x => x.id === id);
  return `<nav class="progress" aria-label="Var du är i processen"><div class="wrap">
    <p class="steps-mobile-title">Steg ${Math.min(step, 3)} av 3 · ${STEG[Math.min(step, 3) - 1]} <span>· ${timeLeft(id)}</span></p>
    <ol class="steps">${STEG.map((t, i) => {
      const n = i + 1; const done = n < step || step === 4; const cur = n === step;
      const w = done ? 100 : cur ? Math.round((pos + 1) / (inStep.length + 0.6) * 100) : 0;
      return `<li class="${done ? 'is-done' : ''}${cur ? ' is-current' : ''}" ${cur ? 'aria-current="step"' : ''}>
        <span class="bar"><i style="width:${w}%"></i></span>
        <span class="lbl"><span class="num">${done ? '✓' : n}</span><span class="t">${t}</span></span>
      </li>`;
    }).join('')}</ol>
  </div></nav>`;
}

  if (S.boende) it.push({ ic: 'home', k: 'Boende', v: [LBL.boende[S.boende], S.storlek && S.storlek !== 'egen' && LBL.storlek[S.storlek], harHus() && !egen() && S.uppvarmning && LBL.uppvarmning[S.uppvarmning]].filter(Boolean).join(' · '), e: 'boende' });

const RESET_KWH = ['boende', 'storlek', 'uppvarmning', 'elbil', 'egenKwh'];

app.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t || !app.contains(t)) return;
  if (t.matches('[data-noop]')) { e.preventDefault(); toast('Demo: länken leder inte vidare i prototypen.'); return; }
  if (t.dataset.set) {
    const key = t.dataset.set, val = t.dataset.value;
    S[key] = val;
    if (RESET_KWH.includes(key)) S.justerad = null;
    if (key === 'boende' && val === 'lagenhet') S.uppvarmning = null;
    if (key === 'syfte' && S.view === 'start') { save(); go('adress'); return; }
    if (['storlek', 'uppvarmning', 'elbil'].includes(key)) UI.flash = true;
    delete UI.errors[key];
    save(); render({ refocus: t.id });
    return;
  }
  if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.edit) { edit(t.dataset.edit); return; }
  if (t.dataset.pick) {
    S.avtal = t.dataset.pick; save();
    go(S.returnTo && idx(S.returnTo) > idx('avtal') ? S.returnTo : 'granska');
    return;
  }
  if (t.dataset.addon) {
    const k = t.dataset.addon; S.tillagg[k] = !S.tillagg[k]; save();
    render({ refocus: null, keepScroll: true });
    const b = $(`[data-addon="${k}"]`, app); if (b) b.focus({ preventScroll: true });
    toast(S.tillagg[k] ? `${k === 'nara' ? 'Bixia Nära' : 'Realtidsmätare'} är tillagd i din sammanfattning.` : 'Tillägget är borttaget.');
    return;
  }
  if (t.dataset.more) { openMore(t.dataset.more); return; }
  if (t.hasAttribute('data-help')) { openHelp(); return; }
  if (t.dataset.demo === 'reset') { resetAll(); return; }
  const act = t.dataset.act;
  if (act === 'next') forward();
  else if (act === 'back') back();
  else if (act === 'skipPrio') { S.prio = 'vetej'; save(); go('avtal'); }
  else if (act === 'resetKwh') { S.justerad = null; save(); render({ keepScroll: true }); }
  else if (act === 'explain') openExplain();
  else if (act === 'terms') { e.preventDefault(); openTerms(); }
});

app.addEventListener('input', e => {
  const el = e.target; const key = el.dataset.input;
  if (!key) return;
  if (key === 'postnummer') {
    const d = el.value.replace(/\D/g, '').slice(0, 5);
    const f = d.length > 3 ? d.slice(0, 3) + ' ' + d.slice(3) : d;
    if (el.value !== f) el.value = f;
    S.postnummer = f;
  } else if (key === 'egenKwh') {
    const d = el.value.replace(/\D/g, '').slice(0, 6);
    if (el.value !== d) el.value = d;
    S.egenKwh = d; S.justerad = null;
  } else if (key === 'justerad') {
    S.justerad = parseInt(el.value, 10) === kwhBas() ? null : parseInt(el.value, 10);
    const txt = $('#f-kwh', app); if (txt) txt.value = el.value;
  } else if (key === 'justeradText') {
    const v = parseInt(el.value.replace(/\D/g, ''), 10);
    if (Number.isFinite(v) && v >= 300 && v <= 100000) {
      S.justerad = v === kwhBas() ? null : v;
      const r = $('#f-range', app); if (r) { if (v > +r.max) r.max = Math.ceil(v / 1000) * 1000; r.value = v; }

    S[key] = el.value;

  if (key === 'egenKwh') setErr('egenKwh', false);
  el.removeAttribute('aria-invalid');

});

app.addEventListener('change', e => {

});

app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.input')) { e.preventDefault(); forward(); }

  if (['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'].includes(e.key) && e.target.matches('[role="radio"]')) {

const oroot = $('#overlay-root');
let lastFocus = null;
function openSheet(html, { right = false, label = 'Dialog', onClose } = {}) {
  lastFocus = document.activeElement;
  oroot.innerHTML = `<div class="overlay${right ? ' right' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">
    <div class="scrim" data-close></div>
    <div class="sheet" tabindex="-1">${html}</div>
  </div>`;
  const sheet = $('.sheet', oroot);
  sheet.focus();
  oroot.onclick = ev => {
    if (ev.target.closest('[data-close]')) { closeSheet(); if (onClose) onClose(); return; }
    const t = ev.target.closest('button');
    if (t && t.dataset.sheetAct && sheetActs[t.dataset.sheetAct]) sheetActs[t.dataset.sheetAct](t);
  };
  oroot.onkeydown = ev => {
    if (ev.key === 'Escape') { closeSheet(); if (onClose) onClose(); }
    if (ev.key === 'Tab') {
      const f = $$('button, a[href], input, summary, [tabindex="0"]', sheet).filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
    }
  };
}

function qrSVG() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const n = 25; let cells = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#231C19"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#231C19"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#231C19"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true">${cells}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}
